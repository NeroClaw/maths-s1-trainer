<style>
/* ==========================================================================
   01. TOKENS
   ========================================================================== */
:root {
  --paper: #f6f3ec;
  --surface: #fffdf8;
  --surface-2: #efeade;
  --ink: #15181d;
  --muted: #5d6672;
  --line: #e0dace;
  --accent: #a8431c;
  --accent-soft: #f3e2d7;
  --on-accent: #fffdf8;
  --ok: #0d6b58;
  --ok-soft: #dceee8;
  --bad: #9c2a24;
  --bad-soft: #f6dedb;
  --warn: #7d5310;
  --shadow: 0 10px 30px -18px rgba(21, 24, 29, 0.45);
  --radius: 14px;
  --radius-sm: 9px;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: clamp(1.25rem, 1.1rem + 0.8vw, 1.6rem);
  --fs-hero: clamp(1.9rem, 1.4rem + 2.6vw, 3rem);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Instrument Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --wrap: 60rem;
}
html[data-theme="dark"] {
  --paper: #101318;
  --surface: #171b22;
  --surface-2: #1e242c;
  --ink: #e9e6e0;
  --muted: #9aa3af;
  --line: #2a313a;
  --accent: #e2743f;
  --accent-soft: #33231b;
  --on-accent: #14171c;
  --ok: #4cc4a3;
  --ok-soft: #1b3a33;
  --bad: #e5746b;
  --bad-soft: #3a201e;
  --warn: #d9a53f;
  --shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.8);
}

/* ==========================================================================
   02. RESET & BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
p { margin: 0 0 var(--space-3); }
ul, ol { margin: 0 0 var(--space-3); padding-inline-start: 1.25rem; }
li { margin-block: var(--space-1); }
strong { font-weight: 600; }
code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--surface-2);
  padding: 0.05em 0.25em;
  border-radius: 4px;
}
/* Variables et expressions mathématiques : serif, lisible, sans bruit visuel */
.m {
  display: inline;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
  font-size: 1.06em;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: var(--space-4); }

/* ==========================================================================
   03. HEADER
   ========================================================================== */
.top {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter: blur(10px);
  border-block-end: 1px solid var(--line);
}
.top__row { display: flex; align-items: center; gap: var(--space-3); padding-block: var(--space-3); }
.brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.brand__mark {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
  border-radius: 11px;
  font-family: var(--font-mono); font-weight: 600; font-size: 1.05rem;
}
.brand__txt { min-width: 0; }
.brand__title { font-size: 1.02rem; font-weight: 700; }
.brand__sub { font-size: var(--fs-xs); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.top__actions { margin-inline-start: auto; display: flex; align-items: center; gap: var(--space-2); }
.iconbtn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.iconbtn:hover { background: var(--surface-2); border-color: var(--accent); }
.iconbtn:active { transform: translateY(1px); }
.iconbtn svg { width: 19px; height: 19px; }

.progress { display: flex; align-items: center; gap: var(--space-2); }
.progress__bar { width: 72px; height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress__fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
.progress__txt { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }

/* ==========================================================================
   04. TABS
   ========================================================================== */
.tabbar {
  display: flex; gap: var(--space-2);
  overflow-x: auto; scrollbar-width: none;
  padding-block-end: var(--space-2);
}
.tabbar::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  min-height: 40px;
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding-inline: var(--space-3);
  background: transparent; border: 1px solid var(--line);
  border-radius: 99px; cursor: pointer;
  font-size: var(--fs-sm); font-weight: 500; color: var(--muted);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.tab:hover { color: var(--ink); border-color: var(--accent); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tab__num { font-family: var(--font-mono); font-size: 0.7rem; opacity: 0.75; }
.tab__dot { width: 6px; height: 6px; border-radius: 99px; background: var(--ok); display: none; }
.tab.is-done .tab__dot { display: block; }
.tab[aria-selected="true"] .tab__dot { background: var(--on-accent); }

/* ==========================================================================
   05. SECTIONS
   ========================================================================== */
main { padding-block-end: var(--space-7); }
.panel { display: none; padding-block-start: var(--space-5); }
.panel.is-active { display: block; animation: fade 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.chap-head { margin-block-end: var(--space-5); }
.chap-head__eyebrow {
  font-family: var(--font-mono); font-size: var(--fs-xs);
  color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase;
  display: block; margin-block-end: var(--space-2);
}
.chap-head h1 { font-size: var(--fs-hero); font-weight: 700; }
.chap-head p { color: var(--muted); margin-block-start: var(--space-2); max-width: 48ch; }

.block { margin-block-end: var(--space-6); }
.block__title {
  display: flex; align-items: center; gap: var(--space-2);
  font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 600;
  padding-block-end: var(--space-2); margin-block-end: var(--space-3);
  border-block-end: 1px solid var(--line);
}
.block__title span.ic { font-size: 1rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--space-4);
  box-shadow: var(--shadow);
}
.card + .card { margin-block-start: var(--space-3); }
.card h3 {
  display: flex;
  gap: var(--space-2);
  align-items: baseline;
  font-size: 1.02rem;
  margin-block-end: var(--space-2);
}
.card h3::before { content: "▸"; color: var(--accent); font-size: 0.85em; }
.card p { line-height: 1.7; }
.card p:last-child, .card ul:last-child, .card ol:last-child { margin-block-end: 0; }

.grid2 { display: grid; gap: var(--space-3); }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }

/* Barre d'onglets : grille lisible sur petit écran, aucun onglet masqué */
@media (max-width: 560px) {
  .tabbar {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-2);
    overflow-x: visible;
  }
  .tab {
    justify-content: center;
    padding-inline: var(--space-1);
    font-size: 0.78rem;
    min-height: 44px;
    text-align: center;
    line-height: 1.15;
  }
  .tab__num { display: none; }
}

.formula {
  display: block;
  font-family: var(--font-mono);
  font-size: clamp(0.76rem, 0.7rem + 0.3vw, 0.92rem);
  line-height: 1.9;
  text-align: center;
  text-wrap: balance;
  font-variant-numeric: tabular-nums;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-3);
  margin-block: var(--space-3);
  overflow-x: auto;
  white-space: normal;
}
.formula .mx { white-space: nowrap; }

/* Matrices : crochets typographiques */
.mx {
  display: inline-grid;
  gap: 0.3em 1.1em;
  padding: 0.3em 0.55em;
  border-inline: 0.12em solid currentColor;
  border-radius: 2px;
  vertical-align: middle;
  text-align: center;
  font-size: 0.95em;
  line-height: 1.35;
}
.mx--2 { grid-template-columns: repeat(2, minmax(1.6em, auto)); }
.mx--3 { grid-template-columns: repeat(3, minmax(1.4em, auto)); }

/* Encadré d'exemple travaillé */
.ex {
  margin-block-start: var(--space-3);
  padding: var(--space-3);
  border: 1px dashed var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.ex__tag {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent);
  margin-block-end: var(--space-2);
}
.ex p { font-size: var(--fs-sm); }
.ex > :last-child { margin-block-end: 0; }
.ex .formula { background: var(--surface-2); }

/* Étapes numérotées */
.steps {
  list-style: none;
  counter-reset: st;
  padding-inline-start: 0;
  margin-block: var(--space-3);
}
.steps > li {
  counter-increment: st;
  position: relative;
  padding-inline-start: 2.1rem;
  min-block-size: 1.6rem;
  font-size: var(--fs-sm);
  line-height: 1.6;
  margin-block: var(--space-2);
}
.steps > li::before {
  content: counter(st);
  position: absolute;
  inset-inline-start: 0;
  inset-block-start: 0.1rem;
  inline-size: 1.5rem;
  block-size: 1.5rem;
  line-height: 1.5rem;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-align: center;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 50%;
}

/* Table de conversion */
.basetbl {
  inline-size: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  margin-block: var(--space-3);
}
.basetbl caption {
  caption-side: top;
  text-align: start;
  font-family: var(--font-body);
  font-size: 0.75rem;
  color: var(--muted);
  padding-block-end: var(--space-1);
}
.basetbl th, .basetbl td {
  border: 1px solid var(--line);
  padding: 0.1rem 0.25rem;
  text-align: center;
}
.basetbl th { background: var(--surface-2); font-weight: 600; }
.basetbl tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }

.trap {
  display: grid; grid-template-columns: auto 1fr; gap: var(--space-3);
  padding-block: var(--space-3);
  border-block-start: 1px dashed var(--line);
}
.trap:first-of-type { border-block-start: 0; padding-block-start: 0; }
.trap__flag {
  font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 600;
  color: var(--bad); background: var(--bad-soft);
  padding: 0.15rem 0.45rem; border-radius: 6px; height: fit-content;
  white-space: nowrap;
}
.trap p { margin: 0; font-size: var(--fs-sm); }
.trap .fix { color: var(--ok); font-weight: 500; }

/* ==========================================================================
   06. CALCULATORS
   ========================================================================== */
.calc { background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--radius); padding: var(--space-4); }
.calc__grid { display: grid; gap: var(--space-3); grid-template-columns: 1fr; }
@media (min-width: 520px) { .calc__grid { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); } }
.field { display: flex; flex-direction: column; gap: var(--space-1); }
.field label { font-size: var(--fs-xs); color: var(--muted); font-weight: 500; }
input[type="number"], input[type="text"], select {
  font-family: var(--font-mono); font-size: var(--fs-sm);
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 0.6rem 0.7rem;
  min-height: 44px;
  width: 100%;
}
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 44px; padding-inline: var(--space-4);
  background: var(--accent); color: var(--on-accent);
  border: 1px solid var(--accent); border-radius: var(--radius-sm);
  font-weight: 600; font-size: var(--fs-sm); cursor: pointer;
  transition: transform 0.2s, filter 0.2s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(1px); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn--ghost:hover { border-color: var(--accent); color: var(--accent); }
.calc__actions { margin-block-start: var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-2); }
.out {
  margin-block-start: var(--space-3);
  font-family: var(--font-mono); font-size: var(--fs-sm);
  line-height: 1.75;
  white-space: pre-wrap; word-break: break-word;
}
.out:empty { display: none; }
.out .k { color: var(--muted); }
.out .v { color: var(--accent); font-weight: 600; }
.out .step { color: var(--muted); }
.hint { font-size: var(--fs-xs); color: var(--muted); margin-block-start: var(--space-2); }

table.tt { border-collapse: collapse; font-family: var(--font-mono); font-size: var(--fs-sm); margin-block-start: var(--space-3); width: 100%; }
table.tt th, table.tt td { border: 1px solid var(--line); padding: 0.35rem 0.55rem; text-align: center; }
table.tt th { background: var(--surface-2); font-weight: 600; }
table.tt tr.t td { background: var(--ok-soft); color: var(--ok); font-weight: 600; }

/* ==========================================================================
   07. QUIZ
   ========================================================================== */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); box-shadow: var(--shadow); }
.quiz__meta { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); margin-block-end: var(--space-3); }
.quiz__count { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--muted); }
.quiz__q { font-size: var(--fs-lg); font-weight: 600; font-family: var(--font-display); margin-block-end: var(--space-3); }
.quiz__opts { display: grid; gap: var(--space-2); }
.opt {
  text-align: start; width: 100%; min-height: 48px;
  padding: var(--space-3);
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); cursor: pointer;
  font-family: var(--font-mono); font-size: var(--fs-sm);
  transition: all 0.18s;
  display: flex; align-items: center; gap: var(--space-2);
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.opt__key {
  font-size: 0.68rem; width: 18px; height: 18px; flex: none;
  display: grid; place-items: center;
  border-radius: 4px; background: var(--surface); border: 1px solid var(--line);
  color: var(--muted);
}
.feedback { margin-block-start: var(--space-3); font-size: var(--fs-sm); display: none; }
.feedback.show { display: block; animation: fade 0.25s; }
.feedback__verdict { font-weight: 600; display: block; margin-block-end: var(--space-1); }
.feedback__verdict.ok { color: var(--ok); }
.feedback__verdict.bad { color: var(--bad); }
.quiz__foot { margin-block-start: var(--space-4); display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.score { font-family: var(--font-mono); font-size: var(--fs-sm); }
.score b { color: var(--accent); }

.flashdeck { display: grid; gap: var(--space-2); }
@media (min-width: 700px) { .flashdeck { grid-template-columns: 1fr 1fr; } }
.flash {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; text-align: start;
  padding: var(--space-3); width: 100%; min-height: 52px;
  transition: border-color 0.2s, background 0.2s;
}
.flash:hover { border-color: var(--accent); }
.flash__recto { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 600; display: block; }
.flash__verso {
  display: none; font-size: var(--fs-sm); color: var(--muted);
  margin-block-start: var(--space-2); padding-block-start: var(--space-2);
  border-block-start: 1px dashed var(--line);
}
.flash[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.flash[aria-expanded="true"] .flash__verso { display: block; }
.flash__hint { font-size: 0.68rem; color: var(--muted); margin-block-start: var(--space-1); display: block; }
.flash[aria-expanded="true"] .flash__hint { display: none; }

/* ==========================================================================
   08. MEMO / PRINT
   ========================================================================== */
.memo-grid { display: grid; gap: var(--space-3); }
@media (min-width: 700px) { .memo-grid { grid-template-columns: 1fr 1fr; } }
.memo-card { break-inside: avoid; }
.memo-card h3 { color: var(--accent); font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--font-body); font-weight: 600; }
.memo-card ul { font-size: var(--fs-sm); padding-inline-start: 1.1rem; }
.memo-card .formula { font-size: 0.78rem; }

/* ==========================================================================
   04b. MÉTHODES (recettes pas à pas)
   ========================================================================== */
.methode-intro { font-size: var(--fs-sm); color: var(--muted); margin-block-end: var(--space-3); max-inline-size: 62ch; }
.recette {
  background: var(--surface);
  border: 1px solid var(--line);
  border-inline-start: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: var(--space-3);
  box-shadow: var(--shadow);
}
.recette + .recette { margin-block-start: var(--space-3); }
.recette h3 {
  font-family: var(--font-body);
  font-size: var(--fs-md);
  font-weight: 600;
  margin: 0;
  padding: 0;
  color: var(--ink);
}
.recette h3::before { content: none; }
.recette__tag {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-block-end: var(--space-1);
}
.recette__when {
  font-size: var(--fs-sm);
  background: var(--accent-soft);

<script>
const CHAPTERS = [
{
  id: 'arith',
  num: '01',
  title: 'Arithmétique',
  tagline: 'Division euclidienne, PGCD, Bézout, PPCM, puissances modulo n et clés de contrôle. Une recette par question, avec le déroulé complet et les pièges.',
  essentiel: `
    <div class="card">
      <h3>Divisibilité : ce que ça veut dire exactement</h3>
      <p><span class="m">a | b</span> se lit « a divise b ». Traduction formelle : il existe un entier <span class="m">k</span> tel que <span class="m">b = k × a</span>. Autrement dit, la division de <span class="m">b</span> par <span class="m">a</span> tombe juste, sans reste.</p>
      <ul>
        <li><span class="m">a</span> est le <strong>diviseur</strong>, <span class="m">b</span> le <strong>multiple</strong>. L’ordre compte : <span class="m">3 | 12</span> est vrai, <span class="m">12 | 3</span> est faux.</li>
        <li><span class="m">1</span> divise tout entier. Tout entier non nul divise <span class="m">0</span>, car <span class="m">0 = 0 × a</span>.</li>
        <li><span class="m">0 | b</span> n’a de sens que pour <span class="m">b = 0</span> : on ne divise pas par zéro, donc en pratique <span class="m">a ≠ 0</span>.</li>
      </ul>
      <p><strong>Trois propriétés à savoir réutiliser</strong> :</p>
      <span class="formula">a | b et b | c ⇒ a | c &nbsp;(transitivité)<br>a | b et a | c ⇒ a | (b + c) et a | (b − c)<br>a | b ⇒ a | (k × b) pour tout entier k</span>
      <p>La deuxième se généralise : si <span class="m">a</span> divise <span class="m">b</span> et <span class="m">c</span>, alors <span class="m">a</span> divise toute <strong>combinaison linéaire</strong> <span class="m">ub + vc</span>. C’est exactement l’argument qui fait fonctionner l’algorithme d’Euclide.</p>
    </div>

    <div class="card">
      <h3>Critères de divisibilité : d’où ils viennent</h3>
      <p>Un nombre s’écrit en base 10 : <span class="m">n = … + c₂×100 + c₁×10 + c₀</span>. Les critères viennent des congruences de 10 modulo le diviseur.</p>
      <table class="basetbl">
        <caption>Critère et raisonnement</caption>
        <thead><tr><th>Par</th><th>Test</th><th>Pourquoi</th></tr></thead>
        <tbody>
          <tr><td>2</td><td>dernier chiffre pair</td><td>10 ≡ 0 [2], tout sauf les unités disparaît</td></tr>
          <tr><td>3</td><td>somme des chiffres</td><td>10 ≡ 1 [3], donc n ≡ somme des chiffres [3]</td></tr>
          <tr><td>4</td><td>deux derniers chiffres</td><td>100 ≡ 0 [4]</td></tr>
          <tr><td>5</td><td>finit par 0 ou 5</td><td>10 ≡ 0 [5]</td></tr>
          <tr><td>9</td><td>somme des chiffres</td><td>10 ≡ 1 [9], même raisonnement que 3</td></tr>
          <tr><td>11</td><td>somme alternée</td><td>10 ≡ −1 [11], donc les signes alternent</td></tr>
        </tbody>
      </table>
      <div class="ex">
        <span class="ex__tag">Exemple : 1 234 567</span>
        <p>Somme des chiffres : <span class="m">1+2+3+4+5+6+7 = 28</span>. 28 n’est ni multiple de 3 ni de 9, donc le nombre n’est divisible ni par 3 ni par 9.</p>
        <p>Somme alternée : <span class="m">7 − 6 + 5 − 4 + 3 − 2 + 1 = 4</span>, non multiple de 11.</p>
      </div>
    </div>

    <div class="card">
      <h3>Division euclidienne : le mode d’emploi</h3>
      <p>Pour <span class="m">a ∈ ℤ</span> et <span class="m">b ∈ ℕ*</span>, il existe un <strong>unique</strong> couple <span class="m">(q, r)</span> tel que :</p>
      <span class="formula">a = b × q + r &nbsp;&nbsp;avec&nbsp;&nbsp; 0 ≤ r &lt; b</span>
      <p>Le quotient <span class="m">q</span> est la partie entière de <span class="m">a/b</span> ; le reste <span class="m">r</span> est ce qui manque pour retomber sur <span class="m">a</span>.</p>
      <div class="ex">
        <span class="ex__tag">Cas positif : 487 par 13</span>
        <p><span class="m">13 × 37 = 481</span>, donc <span class="m">487 = 13 × 37 + 6</span>. Quotient 37, reste 6, et <span class="m">0 ≤ 6 &lt; 13</span>.</p>
      </div>
      <div class="ex">
        <span class="ex__tag">Cas négatif : −17 par 5</span>
        <p>On cherche le plus grand multiple de 5 inférieur ou égal à −17 : c’est <span class="m">−20 = 5 × (−4)</span>.</p>
        <span class="formula">−17 = 5 × (−4) + 3 → q = −4 et r = 3</span>
        <p>Écrire <span class="m">−17 = 5 × (−3) − 2</span> est vrai arithmétiquement, mais <span class="m">r = −2</span> viole <span class="m">r ≥ 0</span>. Le reste euclidien est <strong>toujours</strong> positif.</p>
      </div>
      <p><strong>Pourquoi r &lt; b</strong> : si <span class="m">r ≥ b</span>, on peut encore retirer un <span class="m">b</span> et augmenter <span class="m">q</span> d’une unité. Le couple ne serait plus unique, donc on impose que <span class="m">r</span> soit le plus petit résidu possible.</p>
      <p>C’est ce reste qui relie tout le chapitre : <span class="m">a ≡ r [b]</span>, et <span class="m">pgcd(a, b) = pgcd(b, r)</span>, le moteur d’Euclide.</p>
    </div>

    <div class="card">
      <h3>Nombres premiers et décomposition</h3>
      <p>Un entier <span class="m">n ≥ 2</span> est premier s’il n’a que <strong>deux</strong> diviseurs : 1 et lui-même. Donc 1 n’est pas premier, et 2 est le seul premier pair.</p>
      <p><strong>Test de primalité</strong> : on essaie les nombres premiers jusqu’à <span class="m">√n</span> seulement. Raison : si <span class="m">n = a × b</span> avec <span class="m">a ≤ b</span>, alors <span class="m">a ≤ √n</span>. Inutile de tester au-delà.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : 360 en facteurs premiers</span>
        <span class="formula">360 ÷ 2 = 180<br>180 ÷ 2 = 90<br>90 ÷ 2 = 45<br>45 ÷ 3 = 15<br>15 ÷ 3 = 5<br>5 ÷ 5 = 1</span>
        <p><span class="m">360 = 2³ × 3² × 5</span>. La décomposition est <strong>unique</strong> à l’ordre près : c’est le théorème fondamental de l’arithmétique.</p>
        <p><strong>Bonus</strong> : le nombre de diviseurs vaut <span class="m">(3+1)(2+1)(1+1) = 24</span>. On ajoute 1 à chaque exposant et on multiplie.</p>
      </div>
    </div>

    <div class="card">
      <h3>PGCD : le plus grand diviseur commun</h3>
      <p>Le PGCD de <span class="m">a</span> et <span class="m">b</span> est le plus grand entier positif qui divise les deux. On note <span class="m">pgcd(a, b)</span>, parfois <span class="m">a ∧ b</span>.</p>
      <div class="ex">
        <span class="ex__tag">Exemple concret : 84 et 36</span>
        <p>Diviseurs de 84 : 1, 2, 3, 4, 6, 7, 12, 14, 21, 28, 42, 84. Diviseurs de 36 : 1, 2, 3, 4, 6, 9, 12, 18, 36.</p>
        <p>Communs : 1, 2, 3, 4, 6, 12. Le plus grand est <strong>12</strong>.</p>
      </div>
      <p><strong>Trois méthodes</strong>, à choisir selon les nombres :</p>
      <ol class="steps">
        <li><strong>Lister les diviseurs</strong> : seulement pour de petits nombres, comme ci-dessus.</li>
        <li><strong>Décomposition</strong> : produit des facteurs communs pris avec le <em>plus petit</em> exposant.</li>
        <li><strong>Euclide</strong> : divisions successives, la méthode universelle et la plus rapide.</li>
      </ol>
      <div class="ex">
        <span class="ex__tag">Méthode 2 sur 84 et 36</span>
        <span class="formula">84 = 2² × 3 × 7 &nbsp;·&nbsp; 36 = 2² × 3²<br>pgcd = 2² × 3 = 12</span>
        <p>Le 7 n’est pas commun, il est exclu. Pour le PPCM, on prend au contraire <strong>tous</strong> les facteurs avec le <em>plus grand</em> exposant : <span class="m">2² × 3² × 7 = 252</span>.</p>
      </div>
      <p><strong>Propriétés utiles</strong> :</p>
      <ul>
        <li><span class="m">pgcd(a, 0) = a</span> et <span class="m">pgcd(a, 1) = 1</span>.</li>
        <li><span class="m">pgcd(a, b) = pgcd(|a|, |b|)</span> : le signe ne change rien.</li>
        <li><span class="m">pgcd(ka, kb) = k × pgcd(a, b)</span> : un facteur commun se met en facteur.</li>
      </ul>
      <p>Et surtout : <strong>tout diviseur commun divise le PGCD</strong>. Les diviseurs communs de 84 et 36 sont exactement les diviseurs de 12.</p>
      <p><strong>Application immédiate</strong> : rendre une fraction irréductible. <span class="m">84/126</span>, avec <span class="m">pgcd(84, 126) = 42</span>, donne <span class="m">2/3</span>. Diviser par 6 ou par 7 ne suffit pas : la fraction ne serait pas irréductible.</p>
    </div>

    <div class="card">
      <h3>Algorithme d’Euclide : comment et pourquoi</h3>
      <p>On divise <span class="m">a</span> par <span class="m">b</span>, puis on remplace <span class="m">(a, b)</span> par <span class="m">(b, r)</span>, et on recommence. On s’arrête quand le reste vaut 0 : le <strong>dernier reste non nul</strong> est le PGCD.</p>
      <table class="basetbl">
        <caption>pgcd(1071, 1029)</caption>
        <thead><tr><th>Étape</th><th>Division</th><th>Reste</th></tr></thead>
        <tbody>
          <tr><td>1</td><td>1071 = 1029 × 1 + 42</td><td>42</td></tr>
          <tr><td>2</td><td>1029 = 42 × 24 + 21</td><td>21</td></tr>
          <tr><td>3</td><td>42 = 21 × 2 + 0</td><td>0 → stop</td></tr>
        </tbody>
      </table>
      <p>Dernier reste non nul : <span class="m">pgcd(1071, 1029) = 21</span>.</p>
      <p><strong>Pourquoi ça marche</strong> : dans <span class="m">a = bq + r</span>, on a <span class="m">r = a − bq</span>. Tout entier qui divise <span class="m">a</span> et <span class="m">b</span> divise donc <span class="m">r</span>, par combinaison linéaire. Réciproquement, tout entier qui divise <span class="m">b</span> et <span class="m">r</span> divise <span class="m">a</span>. Les deux couples ont donc <strong>exactement les mêmes diviseurs communs</strong>, donc le même PGCD.</p>
      <p><strong>Pourquoi ça s’arrête</strong> : la suite des restes est strictement décroissante et positive. On atteint forcément 0. Le nombre d’étapes est logarithmique, ce qui rend la méthode utilisable sur de très grands nombres : c’est elle qui tourne dans les calculatrices et les bibliothèques crypto.</p>
      <div class="ex">
        <span class="ex__tag">Version courte à écrire sur la copie</span>
        <span class="formula">84 = 36 × 2 + 12<br>36 = 12 × 3 + 0<br>donc pgcd(84, 36) = 12</span>
      </div>
    </div>

    <div class="card">
      <h3>Théorème de Bézout et Euclide étendu</h3>
      <p>Le PGCD n’est pas seulement un diviseur : c’est une <strong>combinaison linéaire</strong> de <span class="m">a</span> et <span class="m">b</span>.</p>
      <span class="formula">Si d = pgcd(a, b), alors ∃ u, v ∈ ℤ tels que a·u + b·v = d</span>
      <p><strong>Méthode</strong> : on remonte les divisions d’Euclide de la dernière vers la première, en remplaçant chaque reste par son expression en fonction des deux précédents.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : 84 et 36</span>
        <span class="formula">84 = 36 × 2 + 12 &nbsp;⇒&nbsp; 12 = 84 − 2 × 36</span>
        <p>Une seule étape suffit : <span class="m">pgcd = 12 = 84 × 1 + 36 × (−2)</span>, donc <span class="m">u = 1</span> et <span class="m">v = −2</span>. Vérification : <span class="m">84 − 72 = 12</span>.</p>
      </div>
      <div class="ex">
        <span class="ex__tag">Exemple : 1071 et 1029 (remontée complète)</span>
        <span class="formula">21 = 1029 − 24 × 42<br>42 = 1071 − 1 × 1029<br>21 = 1029 − 24 × (1071 − 1029)<br>21 = 1029 × 25 − 1071 × 24</span>
        <p>Donc <span class="m">1071 × (−24) + 1029 × 25 = 21</span>. Contrôle : <span class="m">25 725 − 25 704 = 21</span>.</p>
      </div>
      <p><strong>Cas clé</strong> : <span class="m">a</span> et <span class="m">b</span> sont premiers entre eux <strong>si et seulement si</strong> il existe <span class="m">u, v</span> avec <span class="m">au + bv = 1</span>.</p>
      <p><strong>À quoi ça sert</strong> : trouver l’<strong>inverse modulaire</strong> (cœur du RSA), résoudre <span class="m">ax ≡ c [n]</span>, simplifier des congruences. Les coefficients ne sont pas uniques : on peut ajouter <span class="m">k·b</span> à <span class="m">u</span> en retirant <span class="m">k·a</span> à <span class="m">v</span>.</p>
    </div>

    <div class="card">
      <h3>Nombres premiers entre eux</h3>
      <p><span class="m">a</span> et <span class="m">b</span> sont premiers entre eux (ou « étrangers ») quand <span class="m">pgcd(a, b) = 1</span>. Une fraction est irréductible exactement dans ce cas.</p>
      <p><strong>Lemme de Gauss</strong> : si <span class="m">a | bc</span> et <span class="m">pgcd(a, b) = 1</span>, alors <span class="m">a | c</span>. C’est ce qui autorise à simplifier une congruence par un facteur premier avec le module.</p>
      <div class="ex">
        <span class="ex__tag">Exemple d’usage</span>
        <p><span class="m">6 | 4 × 9</span> est vrai (<span class="m">36 = 6 × 6</span>). Comme <span class="m">pgcd(6, 4) = 2 ≠ 1</span>, Gauss ne s’applique pas : 6 ne divise pas 9. En revanche <span class="m">3 | 4 × 9</span> et <span class="m">pgcd(3, 4) = 1</span> donnent bien <span class="m">3 | 9</span>.</p>
      </div>
      <p><strong>Conséquences pratiques</strong> : <span class="m">a/b</span> irréductible ⟺ <span class="m">pgcd(a, b) = 1</span> · si <span class="m">d = pgcd(a, b)</span> alors <span class="m">a/d</span> et <span class="m">b/d</span> sont premiers entre eux · <span class="m">1</span> est premier avec tout entier.</p>
    </div>

    <div class="card">
      <h3>PPCM : le plus petit multiple commun</h3>
      <p>Le PPCM est le plus petit entier <strong>strictement positif</strong> multiple à la fois de <span class="m">a</span> et de <span class="m">b</span>. On note <span class="m">ppcm(a, b)</span> ou <span class="m">a ∨ b</span>.</p>
      <p><strong>Trois méthodes</strong> :</p>
      <ol class="steps">
        <li>Lister les multiples des deux et prendre le premier commun (petits nombres).</li>
        <li>Décomposition : tous les facteurs, avec le <em>plus grand</em> exposant.</li>
        <li>Formule : <span class="m">ppcm(a, b) = a × b / pgcd(a, b)</span>.</li>
      </ol>
      <div class="ex">
        <span class="ex__tag">Exemple : 12 et 18</span>
        <p>Multiples de 12 : 12, 24, 36… Multiples de 18 : 18, 36… Premier commun : <strong>36</strong>.</p>
        <span class="formula">12 = 2² × 3 &nbsp;·&nbsp; 18 = 2 × 3²<br>ppcm = 2² × 3² = 36 = 12 × 18 / 6</span>
      </div>
      <p><strong>Pourquoi la formule</strong> : on écrit <span class="m">a = d·a'</span> et <span class="m">b = d·b'</span> avec <span class="m">d = pgcd(a, b)</span>. Alors <span class="m">a'</span> et <span class="m">b'</span> sont premiers entre eux, et le plus petit multiple commun est <span class="m">d·a'·b' = ab/d</span>.</p>
      <span class="formula">pgcd(a, b) × ppcm(a, b) = a × b &nbsp;(a, b &gt; 0)</span>
      <div class="ex">
        <span class="ex__tag">Application concrète : engrenages</span>
        <p>Une roue de 12 dents entraîne une roue de 18 dents. Les deux retrouvent leur position de départ après <span class="m">ppcm(12, 18) = 36</span> dents, soit 3 tours de la petite et 2 tours de la grande. Même logique pour des cycles de tâches, des feux tricolores ou des périodes de facturation.</p>
      </div>
    </div>

    <div class="card">
      <h3>Congruences : le calcul modulo n</h3>
      <p>Deux nombres sont congrus modulo <span class="m">n</span> quand ils ont le <strong>même reste</strong> dans la division par <span class="m">n</span>.</p>
      <span class="formula">a ≡ b [n] &nbsp;⇔&nbsp; n | (a − b) &nbsp;⇔&nbsp; a et b ont le même reste modulo n</span>
      <p>On peut additionner, soustraire et multiplier des congruences membre à membre, et élever à une puissance. On travaille alors sur les restes <span class="m">0</span> à <span class="m">n−1</span>.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : 2¹⁰ modulo 7</span>
        <span class="formula">2³ = 8 ≡ 1 [7]<br>2⁹ = (2³)³ ≡ 1³ = 1<br>2¹⁰ = 2⁹ × 2 ≡ 2</span>
        <p>Inutile de calculer 1024 : on réduit à chaque étape. C’est la technique des sujets RSA.</p>
      </div>
      <p><strong>Division : la règle exacte</strong>. On ne divise jamais par n’importe quoi. Si <span class="m">ka ≡ kb [n]</span>, alors <span class="m">a ≡ b [n/d]</span> avec <span class="m">d = pgcd(k, n)</span>. Quand <span class="m">d = 1</span> (facteur premier avec le module), la simplification est directe.</p>
      <span class="formula">4 ≡ 10 [6] &nbsp;÷2&nbsp; 2 ≡ 5 [3] &nbsp;(et non [6])</span>
      <p><strong>Inverse modulaire</strong> : trouver <span class="m">x</span> tel que <span class="m">ax ≡ 1 [n]</span> revient à résoudre <span class="m">au + nv = 1</span> par Bézout. Il existe si et seulement si <span class="m">pgcd(a, n) = 1</span>.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : inverse de 3 modulo 7</span>
        <p><span class="m">3 × 5 = 15 = 2 × 7 + 1</span>, donc <span class="m">3 × 5 ≡ 1 [7]</span> : l’inverse de 3 est <strong>5</strong>.</p>
      </div>
    </div>

    <div class="card">
      <h3>Application BTS : les clés de contrôle</h3>
      <p>Les congruences servent à détecter les erreurs de saisie. On calcule une clé à partir des autres chiffres, et le système vérifie que le reste est le bon.</p>
      <div class="ex">
        <span class="ex__tag">EAN-13 : code-barres 5449000000996</span>
        <p>On pondère les 12 premiers chiffres par 1 et 3 en alternance, en partant de la gauche :</p>

  essentiel: `
    <div class="card">
      <h3>Compter dans une base b</h3>
      <p>Une base <span class="m">b</span> utilise exactement <span class="m">b</span> chiffres : de <span class="m">0</span> à <span class="m">b − 1</span>. Chaque position vaut <span class="m">b</span> fois plus que celle à sa droite.</p>
      <span class="formula">N = dₙ × bⁿ + … + d₂ × b²<br>+ d₁ × b¹ + d₀ × b⁰</span>
      <p>Écriture : <span class="m">(dₙ…d₂d₁d₀)ᵦ</span>. Le chiffre le plus à droite est le <strong>poids faible</strong>, celui de gauche le <strong>poids fort</strong>.</p>
      <p>En base 16 (hexadécimal), on complète avec <strong>A&nbsp;=&nbsp;10, B&nbsp;=&nbsp;11, C&nbsp;=&nbsp;12, D&nbsp;=&nbsp;13, E&nbsp;=&nbsp;14, F&nbsp;=&nbsp;15</strong>.</p>
      <table class="basetbl">
        <caption>Table à connaître : les 16 premières valeurs</caption>
        <thead><tr><th>Déc.</th><th>Bin.</th><th>Oct.</th><th>Hex.</th></tr></thead>
        <tbody>
          <tr><td>0</td><td>0000</td><td>0</td><td>0</td></tr>
          <tr><td>1</td><td>0001</td><td>1</td><td>1</td></tr>
          <tr><td>2</td><td>0010</td><td>2</td><td>2</td></tr>
          <tr><td>3</td><td>0011</td><td>3</td><td>3</td></tr>

          <tr><td>7</td><td>0111</td><td>7</td><td>7</td></tr>
          <tr><td>8</td><td>1000</td><td>10</td><td>8</td></tr>
          <tr><td>9</td><td>1001</td><td>11</td><td>9</td></tr>
          <tr><td>10</td><td>1010</td><td>12</td><td>A</td></tr>
          <tr><td>11</td><td>1011</td><td>13</td><td>B</td></tr>

          <tr><td>15</td><td>1111</td><td>17</td><td>F</td></tr>

    <div class="card">
      <h3>Base b → base 10 : la somme des poids</h3>
      <p>On écrit les poids sous chaque chiffre (en partant de la droite : <span class="m">1, b, b², b³…</span>), on multiplie, on additionne.</p>
      <span class="formula">(2AC)₁₆ = 2×16² + 10×16¹ + 12×16⁰ = 512 + 160 + 12 = 684</span>
      <span class="formula">(1021)₃ = 1×27 + 0×9 + 2×3 + 1 = 34</span>
      <span class="formula">(101101)₂ = 32 + 8 + 4 + 1 = 45</span>
      <div class="ex">
        <span class="ex__tag">Astuce : méthode de Horner</span>
        <p>Plus rapide sur les grands nombres, et sans calculer de puissances : on part du chiffre de gauche, on multiplie par la base, on ajoute le chiffre suivant.</p>
        <span class="formula">2 → 2×16 + 10 = 42 → 42×16 + 12 = 684</span>
        <p>En base 2, chaque étape est un « ×2 + bit » : <span class="m">1 → 2 → 5 → 11 → 22 → 45</span>.</p>
      </div>
    </div>

    <div class="card">
      <h3>Base 10 → base b : divisions successives</h3>
      <p>On divise par <span class="m">b</span> autant de fois que nécessaire, on garde les <strong>restes</strong>, puis on les lit <strong>du dernier au premier</strong>. Le dernier quotient non nul donne le chiffre de tête.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : 156 en base 7</span>
        <span class="formula">156 = 7 × 22 + 2<br>22 = 7 × 3 + 1<br>3 = 7 × 0 + 3</span>
        <p>Restes lus à l’envers : <span class="m">2</span>, puis <span class="m">1</span>, puis <span class="m">3</span> → <span class="m">(156)₁₀ = (312)₇</span>. Vérification : <span class="m">3×49 + 1×7 + 2 = 156</span>.</p>
      </div>
      <div class="ex">
        <span class="ex__tag">Exemple : 45 en binaire</span>
        <span class="formula">45 = 2×22 + 1<br>22 = 2×11 + 0<br>11 = 2×5 + 1<br>5 = 2×2 + 1<br>2 = 2×1 + 0<br>1 = 2×0 + 1</span>
        <p>Lecture de bas en haut : <span class="m">101101₂</span>.</p>
      </div>
      <p><strong>Autre méthode</strong> : soustraire la plus grande puissance de <span class="m">b</span> possible, marquer 1, continuer avec le reste (la plus rapide en binaire : <span class="m">45 → 32 + 8 + 4 + 1</span>).</p>
    </div>

    <div class="card">
      <h3>Raccourcis : octal et hexadécimal depuis le binaire</h3>
      <p>Ces deux bases ne sont que des <strong>groupes de bits</strong> : 1 chiffre octal = 3 bits, 1 chiffre hexadécimal = 4 bits.</p>
      <ul>
        <li><strong>Vers l’octal</strong> : regrouper par 3 en partant de la droite, compléter à gauche par des 0.</li>
        <li><strong>Vers l’hexa</strong> : regrouper par 4 en partant de la droite, même complément.</li>
        <li><strong>Sens inverse</strong> : chaque chiffre octal donne 3 bits, chaque chiffre hexa donne 4 bits, dans l’ordre.</li>
      </ul>
      <span class="formula">1101011₂ → 001 101 011 → (153)₈</span>
      <span class="formula">1101011₂ → 0110 1011 → (6B)₁₆</span>
      <span class="formula">(47)₈ = 100 111₂ &nbsp;&nbsp;·&nbsp;&nbsp; (F3)₁₆ = 1111 0011₂</span>
      <p>On ne passe <strong>jamais</strong> par la base 10 entre binaire, octal et hexa : plus long et plus d’erreurs.</p>
    </div>

    <div class="card">
      <h3>Partie fractionnaire (après la virgule)</h3>
      <p>À droite de la virgule, les poids sont négatifs : <span class="m">b⁻¹, b⁻², b⁻³…</span> soit <span class="m">1/b, 1/b², 1/b³…</span></p>
      <span class="formula">(0,101)₂ = 1/2 + 0/4 + 1/8 = 0,625</span>
      <p><strong>Décimal → base b</strong> : on multiplie la partie fractionnaire par <span class="m">b</span>, on note la partie entière, on recommence avec ce qui reste après la virgule. Lecture des parties entières <strong>de haut en bas</strong> (l’inverse des divisions).</p>
      <div class="ex">
        <span class="ex__tag">Exemple : 0,6875 en binaire</span>
        <span class="formula">0,6875 × 2 = 1,375 → 1<br>0,375 × 2 = 0,75 → 0<br>0,75 × 2 = 1,5 → 1<br>0,5 × 2 = 1,0 → 1</span>
        <p>Donc <span class="m">(0,6875)₁₀ = (0,1011)₂</span>. Et <span class="m">45,6875 = 101101,1011₂</span> : partie entière et partie fractionnaire se convertissent séparément.</p>
      </div>
      <p><strong>Attention</strong> : la conversion peut ne jamais s’arrêter. <span class="m">(0,1)₁₀ = (0,0001100110011…)₂</span> est infini, d’où les arrondis des flottants.</p>
    </div>

    <div class="card">
      <h3>Entiers signés : complément à 2</h3>
      <p>Sur <span class="m">n</span> bits, un entier signé va de <span class="m">−2ⁿ⁻¹</span> à <span class="m">2ⁿ⁻¹ − 1</span>. Le bit de poids fort vaut 1 pour un négatif.</p>
      <ol class="steps">
        <li>Écrire la valeur absolue sur <span class="m">n</span> bits.</li>
        <li>Inverser tous les bits (0 ↔ 1).</li>
        <li>Ajouter 1, puis <strong>tronquer à n bits</strong>.</li>
      </ol>
      <div class="ex">
        <span class="ex__tag">Exemple : −6 sur 8 bits</span>
        <span class="formula">6 = 0000 0110<br>inversé = 1111 1001<br>+1 = 1111 1010</span>
        <p>Retour arrière : <span class="m">1111 1010</span> commence par 1, donc négatif. On réinverse et on ajoute 1 → <span class="m">0000 0110 = 6</span>, soit <span class="m">−6</span>.</p>
        <p>Raccourci : <span class="m">valeur = −128 + bits restants</span> = <span class="m">−128 + 122 = −6</span>.</p>
      </div>
      <table class="basetbl">
        <caption>Lecture sur 4 bits (plage −8 à 7)</caption>

    <div class="card">
      <h3>Addition et soustraction en complément à 2</h3>
      <p>On additionne <strong>bit à bit avec les retenues</strong>, comme en primaire. La retenue qui sort à gauche est <strong>abandonnée</strong> : le résultat reste sur <span class="m">n</span> bits.</p>
      <p>Soustraction : <span class="m">a − b = a + (−b)</span>, donc on ajoute le complément à 2 de <span class="m">b</span>. Aucun circuit de soustraction nécessaire, c’est tout l’intérêt du Cà2.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : 45 + (−19)</span>
        <span class="formula">45  = 0010 1101<br>−19 = 1110 1101<br>somme = 1 0001 1010</span>
        <p>On jette la retenue sortante : <span class="m">0001 1010 = 26</span>. Correct, car <span class="m">45 − 19 = 26</span>.</p>
      </div>
      <div class="ex">
        <span class="ex__tag">Débordement (overflow)</span>
        <p>Il y a débordement quand <strong>deux opérandes de même signe</strong> donnent un résultat de <strong>signe opposé</strong>.</p>
        <span class="formula">0110 0100 + 0110 0100 = 1100 1000</span>
        <p><span class="m">100 + 100 = 200</span> dépasse 127 : le résultat affiché (<span class="m">−56</span>) est faux. Le signe final seul ne prouve rien, il faut regarder les deux opérandes.</p>
      </div>
    </div>

    <div class="card">
      <h3>Signe-magnitude, complément à 1, complément à 2</h3>
      <p>Trois façons de coder les négatifs, une seule est utilisée en pratique.</p>
      <ul>
        <li><strong>Signe-magnitude</strong> : 1 bit de signe + valeur absolue. Deux zéros (<span class="m">0000</span> et <span class="m">1000</span>), et l’addition ne fonctionne pas.</li>
        <li><strong>Complément à 1</strong> : on inverse les bits. Deux zéros aussi (<span class="m">0000</span> / <span class="m">1111</span>), avec retenue circulaire à gérer.</li>
        <li><strong>Complément à 2</strong> : inversion + 1. Un seul zéro, addition directe, retenue ignorée. C’est le standard.</li>
      </ul>
      <span class="formula">−5 sur 8 bits · SM : 1000 0101 · Cà1 : 1111 1010 · Cà2 : 1111 1011</span>
    </div>

    <div class="card">
      <h3>Codage des caractères</h3>
      <p><strong>ASCII</strong> : 7 bits utiles, 128 caractères. <strong>Latin-1</strong> étend à 8 bits (256). <strong>UTF-8</strong> code un point Unicode sur 1 à 4 octets : l’ASCII reste identique, un accent prend 2 octets.</p>
      <p>Repères à retenir : espace = <span class="m">32</span>, <span class="m">'0' = 48</span>, <span class="m">'A' = 65</span>, <span class="m">'a' = 97</span>. L’écart majuscule/minuscule vaut toujours <span class="m">32</span> : un seul bit change.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : BCD et taille d’une chaîne</span>
        <p>En <strong>BCD</strong>, chaque chiffre décimal occupe un quartet : <span class="m">42 → 0100 0010</span>. Ce n’est pas du binaire : <span class="m">42</span> en binaire vaut <span class="m">0010 1010</span>.</p>
        <p>La chaîne <span class="m">« Maths »</span> fait 5 caractères, donc 5 octets en ASCII/UTF-8 (aucun accent), soit 40 bits.</p>
      </div>
    </div>

    <div class="card">
      <h3>Unités, tailles et débits</h3>
      <p>1 octet = 8 bits. Préfixes binaires : 1 kio = 1024 o, 1 Mio = 1024 kio, 1 Gio = 1024 Mio. Préfixes décimaux (SI, souvent utilisés par les fabricants de disques) : 1 ko = 1000 o, 1 Mo = 1000 ko.</p>
      <span class="formula">1 kio = 1 024 o &nbsp;·&nbsp; 1 Mio = 1 048 576 o &nbsp;·&nbsp; 1 Gio ≈ 1,074 Go</span>
      <p><strong>Débit</strong> : les réseaux s’expriment en bits par seconde (Mb/s), les fichiers en octets (Mo). On divise par 8.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : téléchargement</span>
        <p>Connexion à <span class="m">100 Mb/s</span> → <span class="m">12,5 Mo/s</span>. Un fichier de <span class="m">4,5 Go</span> (≈ 4608 Mo) demande environ <span class="m">369 s</span>, soit 6 min 10 s.</p>
      </div>
      <p>Limites à connaître : 8 bits non signés → 255 · 16 bits → 65 535 · 32 bits → 4 294 967 295. Flottant 32 bits : 1 signe, 8 exposant (biais 127), 23 mantisse.</p>

{
  id: 'mat',
  num: '03',
  title: 'Matrices',
  tagline: 'Dimensions, produit ligne par colonne, transposée, déterminant, inverse et systèmes linéaires. Les six gestes qui couvrent tous les sujets.',
  essentiel: `
    <div class="card">
      <h3>Vocabulaire et familles de matrices</h3>
      <p>Une matrice <span class="m">A</span> de dimension <span class="m">m × n</span> a <strong>m lignes</strong> et <strong>n colonnes</strong> (toujours dans cet ordre). Le coefficient <span class="m">aᵢⱼ</span> est à la ligne <span class="m">i</span>, colonne <span class="m">j</span>.</p>
      <span class="formula"><span class="mx mx--2"><span>a₁₁</span><span>a₁₂</span><span>a₂₁</span><span>a₂₂</span></span> &nbsp;est une matrice carrée d’ordre 2</span>
      <ul>
        <li><strong>Ligne</strong> : 1 × n · <strong>Colonne</strong> : m × 1 · <strong>Carrée</strong> : m = n.</li>
        <li><strong>Identité <span class="m">Iₙ</span></strong> : 1 sur la diagonale, 0 ailleurs.</li>
        <li><strong>Nulle</strong> : tous les coefficients nuls. <strong>Diagonale</strong> : seuls les <span class="m">aᵢᵢ</span> peuvent être non nuls.</li>
        <li><strong>Triangulaire</strong> : que des 0 au-dessus (inférieure) ou en dessous (supérieure) de la diagonale.</li>
        <li><strong>Symétrique</strong> : <span class="m">Aᵀ = A</span>, c’est-à-dire <span class="m">aᵢⱼ = aⱼᵢ</span>.</li>
      </ul>
      <span class="formula">I₂ = <span class="mx mx--2"><span>1</span><span>0</span><span>0</span><span>1</span></span> &nbsp;·&nbsp; O₂ = <span class="mx mx--2"><span>0</span><span>0</span><span>0</span><span>0</span></span></span>
    </div>

    <div class="card">
      <h3>Égalité, somme, multiplication par un réel</h3>
      <p>Deux matrices sont égales si elles ont <strong>la même dimension</strong> et les mêmes coefficients un à un.</p>
      <p>La somme (et la différence) exige des dimensions <strong>identiques</strong> : on ajoute coefficient par coefficient. Pour <span class="m">k × A</span>, on multiplie <strong>chaque</strong> coefficient par <span class="m">k</span>.</p>
      <div class="ex">
        <span class="ex__tag">Exemple</span>
        <span class="formula"><span class="mx mx--2"><span>1</span><span>2</span><span>3</span><span>4</span></span> + <span class="mx mx--2"><span>5</span><span>6</span><span>7</span><span>8</span></span> = <span class="mx mx--2"><span>6</span><span>8</span><span>10</span><span>12</span></span> &nbsp;·&nbsp; 3 × <span class="mx mx--2"><span>1</span><span>2</span><span>3</span><span>4</span></span> = <span class="mx mx--2"><span>3</span><span>6</span><span>9</span><span>12</span></span></span>
        <p>Ces opérations sont commutatives et distributives, contrairement au produit.</p>
      </div>
    </div>

    <div class="card">
      <h3>Produit matriciel</h3>
      <p><strong>Condition d’existence</strong> : le nombre de colonnes de <span class="m">A</span> doit égaler le nombre de lignes de <span class="m">B</span>.</p>
      <span class="formula">(m × n) · (n × p) = (m × p)</span>
      <p>Chaque coefficient est le produit d’une <strong>ligne de A</strong> par une <strong>colonne de B</strong>, sommé :</p>
      <span class="formula">cᵢⱼ = aᵢ₁b₁ⱼ + aᵢ₂b₂ⱼ + … + aᵢₙbₙⱼ</span>
      <div class="ex">
        <span class="ex__tag">Exemple complet</span>
        <span class="formula">A = <span class="mx mx--2"><span>1</span><span>2</span><span>3</span><span>4</span></span> &nbsp; B = <span class="mx mx--2"><span>5</span><span>6</span><span>7</span><span>8</span></span></span>
        <span class="formula">AB = <span class="mx mx--2"><span>1×5 + 2×7</span><span>1×6 + 2×8</span><span>3×5 + 4×7</span><span>3×6 + 4×8</span></span> = <span class="mx mx--2"><span>19</span><span>22</span><span>43</span><span>50</span></span></span>
        <span class="formula">BA = <span class="mx mx--2"><span>5×1 + 6×3</span><span>5×2 + 6×4</span><span>7×1 + 8×3</span><span>7×2 + 8×4</span></span> = <span class="mx mx--2"><span>23</span><span>34</span><span>31</span><span>46</span></span></span>
        <p><span class="m">AB ≠ BA</span> : le produit n’est pas commutatif. Et <span class="m">AB = O</span> n’implique pas <span class="m">A = O</span> ou <span class="m">B = O</span>.</p>
      </div>
      <p><strong>Calcul pratique</strong> : poser la ligne de A horizontalement et la colonne de B verticalement, multiplier terme à terme, additionner. Écrire les produits intermédiaires évite les erreurs de report.</p>
    </div>

    <div class="card">
      <h3>Identité, puissances, matrices nilpotentes</h3>
      <p><span class="m">Iₙ</span> est l’élément neutre : <span class="m">A · Iₙ = Iₙ · A = A</span> dès que les dimensions coïncident.</p>
      <span class="formula">A² = A × A &nbsp;·&nbsp; A³ = A × A × A &nbsp;·&nbsp; A⁰ = I</span>
      <p><strong>Une matrice peut être nilpotente</strong> : <span class="m">A ≠ O</span> mais <span class="m">A² = O</span>.</p>
      <span class="formula"><span class="mx mx--2"><span>0</span><span>1</span><span>0</span><span>0</span></span>² = <span class="mx mx--2"><span>0</span><span>0</span><span>0</span><span>0</span></span></span>
      <p>Conséquence : les identités remarquables du type <span class="m">(A + B)² = A² + 2AB + B²</span> ne sont valables que si <span class="m">AB = BA</span>. Sinon, il faut écrire <span class="m">A² + AB + BA + B²</span>.</p>
    </div>

    <div class="card">
      <h3>Transposée</h3>
      <p><span class="m">Aᵀ</span> s’obtient en échangeant lignes et colonnes : la ligne 1 devient la colonne 1. Une matrice <span class="m">m × n</span> donne une matrice <span class="m">n × m</span>.</p>
      <span class="formula">A = <span class="mx mx--2"><span>1</span><span>2</span><span>3</span><span>4</span></span> &nbsp;→&nbsp; Aᵀ = <span class="mx mx--2"><span>1</span><span>3</span><span>2</span><span>4</span></span></span>
      <ul>
        <li><span class="m">(Aᵀ)ᵀ = A</span></li>
        <li><span class="m">(A + B)ᵀ = Aᵀ + Bᵀ</span></li>
        <li><span class="m">(kA)ᵀ = k Aᵀ</span></li>
        <li><strong><span class="m">(AB)ᵀ = Bᵀ Aᵀ</span></strong> : l’ordre s’inverse, c’est le piège classique.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Déterminant 2 × 2</h3>
      <span class="formula">det <span class="mx mx--2"><span>a</span><span>b</span><span>c</span><span>d</span></span> = ad − bc</span>
      <p>Produit de la diagonale descendante <strong>moins</strong> produit de la diagonale montante. C’est un <strong>nombre</strong>, pas une matrice.</p>
      <div class="ex">
        <span class="ex__tag">Exemple</span>
        <p><span class="m">det <span class="mx mx--2"><span>3</span><span>5</span><span>2</span><span>4</span></span></span> = <span class="m">3×4 − 5×2 = 12 − 10 = 2</span>, donc la matrice est inversible.</p>
      </div>
      <p><strong>Propriétés</strong> :</p>
      <ul>
        <li><span class="m">det(AB) = det(A) × det(B)</span> et <span class="m">det(Aᵀ) = det(A)</span>.</li>
        <li><span class="m">det(kA) = kⁿ det(A)</span> pour une matrice d’ordre <span class="m">n</span> (et non <span class="m">k · det A</span>).</li>
        <li>Échanger deux lignes change le signe. Une ligne nulle annule le déterminant. Ajouter à une ligne un multiple d’une autre ne le change pas.</li>
        <li><span class="m">det(Iₙ) = 1</span>. Pour une matrice triangulaire, le déterminant est le produit de la diagonale.</li>
      </ul>
    </div>

    <div class="card">
      <h3>Déterminant 3 × 3 : règle de Sarrus</h3>
      <p>On recopie les deux premières colonnes à droite, puis : <strong>trois diagonales descendantes moins trois diagonales montantes</strong>.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : déterminant de M</span>
        <span class="formula">M = <span class="mx mx--3"><span>2</span><span>1</span><span>3</span><span>0</span><span>4</span><span>5</span><span>1</span><span>0</span><span>6</span></span></span>
        <span class="formula">descendantes : 2×4×6 + 1×5×1 + 3×0×0 = 48 + 5 + 0 = 53<br>montantes : 3×4×1 + 2×5×0 + 1×0×6 = 12 + 0 + 0 = 12<br>det M = 53 − 12 = 41</span>
        <p><strong>Contrôle par cofacteurs</strong> (développement sur la première ligne) : <span class="m">2(24 − 0) − 1(0 − 5) + 3(0 − 4)</span> = <span class="m">48 + 5 − 12 = 41</span>. Les deux méthodes doivent donner le même résultat.</p>
      </div>
      <p>Le développement par cofacteurs devient indispensable en 4 × 4 ou dès qu’une ligne contient des zéros : on choisit la ligne ou la colonne la plus vide.</p>
    </div>

    <div class="card">
      <h3>Inverse d’une matrice 2 × 2</h3>
      <p><span class="m">A</span> est inversible <strong>si et seulement si</strong> <span class="m">det(A) ≠ 0</span>. Alors :</p>
      <span class="formula">A⁻¹ = 1/(ad − bc) × <span class="mx mx--2"><span>d</span><span>−b</span><span>−c</span><span>a</span></span></span>
      <p>On échange <span class="m">a</span> et <span class="m">d</span>, on change le signe de <span class="m">b</span> et <span class="m">c</span>, puis on divise <strong>toute</strong> la matrice par le déterminant.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : A = </span>
        <span class="formula">A = <span class="mx mx--2"><span>1</span><span>2</span><span>3</span><span>4</span></span> · det A = 4 − 6 = −2<br>A⁻¹ = 1/(−2) × <span class="mx mx--2"><span>4</span><span>−2</span><span>−3</span><span>1</span></span> = <span class="mx mx--2"><span>−2</span><span>1</span><span>1,5</span><span>−0,5</span></span></span>
        <p><strong>Vérification</strong> : <span class="m">A · A⁻¹ = I₂</span>. C’est le réflexe qui sauve des points, il suffit de 20 secondes.</p>
      </div>
    </div>

    <div class="card">
      <h3>Inverse d’une matrice 3 × 3</h3>
      <p>Méthode par la comatrice (adjugée) :</p>
      <ol class="steps">
        <li>Calculer <span class="m">det A</span>. S’il est nul, <strong>arrêter</strong> : pas d’inverse.</li>
        <li>Calculer les 9 cofacteurs <span class="m">Cᵢⱼ = (−1)ⁱ⁺ʲ × det(mineure)</span>. Le signe suit un damier <span class="m">+ − + / − + − / + − +</span>.</li>
        <li>Transposer la comatrice pour obtenir la <strong>matrice complémentaire</strong> (adjugée).</li>
        <li>Diviser par <span class="m">det A</span> : <span class="m">A⁻¹ = (1/det A) × com(A)ᵀ</span>.</li>
      </ol>
      <div class="ex">
        <span class="ex__tag">Exemple : matrice triangulaire</span>
        <span class="formula">T = <span class="mx mx--3"><span>1</span><span>2</span><span>3</span><span>0</span><span>1</span><span>4</span><span>0</span><span>0</span><span>1</span></span> · det T = 1×1×1 = 1<br>T⁻¹ = <span class="mx mx--3"><span>1</span><span>−2</span><span>5</span><span>0</span><span>1</span><span>−4</span><span>0</span><span>0</span><span>1</span></span></span>
        <p>Sur une triangulaire, le déterminant est le produit de la diagonale et l’inverse reste triangulaire : c’est le cas le plus simple à traiter en sujet.</p>
      </div>
    </div>

    <div class="card">
      <h3>Systèmes linéaires : AX = B</h3>
      <p>Tout système se réécrit <span class="m">A X = B</span> avec <span class="m">A</span> la matrice des coefficients, <span class="m">X</span> le vecteur des inconnues, <span class="m">B</span> le second membre.</p>
      <span class="formula">Si det A ≠ 0 : X = A⁻¹ B</span>
      <p>On multiplie <span class="m">A⁻¹</span> <strong>à gauche</strong> des deux côtés. Écrire <span class="m">B A⁻¹</span> est faux, même quand les dimensions le permettent.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : 2x + y = 5 et x + 3y = 10</span>
        <span class="formula">A = <span class="mx mx--2"><span>2</span><span>1</span><span>1</span><span>3</span></span> · det A = 6 − 1 = 5 ≠ 0</span>
        <p><strong>Cramer</strong> : <span class="m">x = det(Aₓ)/det(A)</span> où <span class="m">Aₓ</span> est <span class="m">A</span> avec la colonne des <span class="m">x</span> remplacée par <span class="m">B</span>.</p>
        <span class="formula">x = (5×3 − 1×10)/5 = 5/5 = 1<br>y = (2×10 − 5×1)/5 = 15/5 = 3</span>
        <p>Solution <span class="m">(1 ; 3)</span>. Vérification : <span class="m">2 + 3 = 5</span> et <span class="m">1 + 9 = 10</span>.</p>
      </div>
      <p>Si <span class="m">det A = 0</span> : soit aucune solution, soit une infinité. Le déterminant nul ne signifie jamais « une seule solution ».</p>
    </div>

    <div class="card">
      <h3>Matrices et graphes</h3>
      <p>Pour un graphe à <span class="m">n</span> sommets, la matrice d’adjacence <span class="m">M</span> est carrée d’ordre <span class="m">n</span> : <span class="m">mᵢⱼ = 1</span> s’il existe une arête de <span class="m">i</span> vers <span class="m">j</span>, sinon <span class="m">0</span>.</p>
      <p>Le coefficient <span class="m">(Mᵏ)ᵢⱼ</span> donne le <strong>nombre de chemins de longueur k</strong> allant de <span class="m">i</span> à <span class="m">j</span>. C’est la question classique du sujet SLAM.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : triangle complet</span>
        <span class="formula">M = <span class="mx mx--3"><span>0</span><span>1</span><span>1</span><span>1</span><span>0</span><span>1</span><span>1</span><span>1</span><span>0</span></span> &nbsp; M² = <span class="mx mx--3"><span>2</span><span>1</span><span>1</span><span>1</span><span>2</span><span>1</span><span>1</span><span>1</span><span>2</span></span></span>
        <p>De 1 vers 1 en 2 étapes : <span class="m">1→2→1</span> et <span class="m">1→3→1</span>, donc <span class="m">2</span> chemins. La diagonale compte les allers-retours, pas les boucles.</p>
      </div>
      <p>Graphe orienté : <span class="m">M</span> n’est pas symétrique. Graphe non orienté : <span class="m">M</span> l’est toujours.</p>
    </div>`,

{

  num: '04',
  title: 'Propositions',
  tagline: 'Traduction, tables de vérité, négation, implication contre réciproque et contraposée, quantificateurs. Des procédures, pas du vocabulaire.',
  essentiel: `
    <div class="card">
      <h3>Proposition, connecteurs : le vocabulaire</h3>
      <p>Une <strong>proposition</strong> est une phrase qui est soit vraie, soit fausse, sans ambiguïté. « 2 + 2 = 4 » est une proposition, « il fait beau » n’en est pas une (dépend du lieu et de l’heure).</p>
      <p>Un <strong>connecteur</strong> combine des propositions pour en fabriquer une nouvelle. Il y en a cinq, et chacun a une table de vérité fixe.</p>
      <ul>
        <li><span class="m">¬p</span> : négation, inverse la valeur de vérité.</li>
        <li><span class="m">p ∧ q</span> : ET, vrai seulement si les deux sont vraies.</li>
        <li><span class="m">p ∨ q</span> : OU inclusif, faux seulement si les deux sont fausses.</li>
        <li><span class="m">p ⊕ q</span> : OU exclusif, vrai si une seule est vraie.</li>
        <li><span class="m">p → q</span> : implication, fausse <strong>uniquement</strong> quand p est vraie et q fausse.</li>
        <li><span class="m">p ↔ q</span> : équivalence, vraie quand les deux ont la même valeur.</li>
      </ul>
      <p><strong>Priorités de lecture</strong> : <span class="m">¬</span> d’abord, puis <span class="m">∧</span>, puis <span class="m">∨</span>, puis <span class="m">→</span>, et enfin <span class="m">↔</span>. En cas de doute, des parenthèses valent mieux qu’un pari.</p>
    </div>

    <div class="card">
      <h3>Table de vérité complète</h3>
      <p>Avec <span class="m">n</span> propositions distinctes, la table a <span class="m">2ⁿ</span> lignes. On remplit les colonnes de gauche à droite, la variable la plus à gauche changeant le moins souvent.</p>
      <table class="basetbl">
        <caption>Les quatre combinaisons et les cinq connecteurs</caption>
        <thead><tr><th>p</th><th>q</th><th>p ∧ q</th><th>p ∨ q</th><th>p ⊕ q</th><th>p → q</th><th>p ↔ q</th></tr></thead>
        <tbody>
          <tr><td>V</td><td>V</td><td>V</td><td>V</td><td>F</td><td>V</td><td>V</td></tr>
          <tr><td>V</td><td>F</td><td>F</td><td>V</td><td>V</td><td>F</td><td>F</td></tr>
          <tr><td>F</td><td>V</td><td>F</td><td>V</td><td>V</td><td>V</td><td>F</td></tr>
          <tr><td>F</td><td>F</td><td>F</td><td>F</td><td>F</td><td>V</td><td>V</td></tr>
        </tbody>
      </table>
      <p><strong>Comment retenir l’implication</strong> : <span class="m">p → q</span> est une promesse. « Si tu révises, tu réussis. » La promesse n’est rompue que dans un seul cas : tu as révisé et tu as échoué. Si tu n’as pas révisé, on ne peut rien te reprocher, la ligne est donc vraie par défaut (vérité vide).</p>
      <p><strong>L’équivalence</strong> est vraie quand les deux propositions ont la même valeur : deux « oui » ou deux « non ». C’est <span class="m">(p → q) ∧ (q → p)</span>.</p>
    </div>

    <div class="card">
      <h3>Implication, réciproque, contraposée, contraire</h3>
      <p>Ces quatre énoncés se ressemblent et un seul est équivalent à l’original.</p>
      <table class="basetbl">
        <caption>Autour de p → q</caption>
        <thead><tr><th>Nom</th><th>Écriture</th><th>Équivalent ?</th></tr></thead>
        <tbody>
          <tr><td>Implication</td><td>p → q</td><td>référence</td></tr>
          <tr><td>Contraposée</td><td>¬q → ¬p</td><td>Oui, toujours</td></tr>
          <tr><td>Réciproque</td><td>q → p</td><td>Non</td></tr>
          <tr><td>Contraire</td><td>¬p → ¬q</td><td>Non</td></tr>
        </tbody>
      </table>
      <div class="ex">
        <span class="ex__tag">Exemple : « s’il pleut, la route est mouillée »</span>
        <p>Contraposée valide : « si la route est sèche, il ne pleut pas ». Réciproque fausse : une route peut être mouillée par un arroseur. Contraire faux : il peut ne pas pleuvoir et la route être mouillée.</p>
      </div>
      <p><strong>Nécessaire et suffisant</strong> : dans <span class="m">p → q</span>, p est une condition <em>suffisante</em> pour q (« il suffit de p pour avoir q »), et q est une condition <em>nécessaire</em> pour p (« sans q, pas de p »). L’équivalence <span class="m">p ↔ q</span> est nécessaire <strong>et</strong> suffisante.</p>
    </div>

    <div class="card">
      <h3>Équivalences à connaître par cœur</h3>
      <p>Elles se démontrent avec une table de vérité, mais les connaître fait gagner tout le temps d’exercice.</p>
      <span class="formula">p → q ≡ ¬p ∨ q</span>
      <span class="formula">p → q ≡ ¬q → ¬p</span>
      <span class="formula">¬(p → q) ≡ p ∧ ¬q</span>
      <span class="formula">¬(p ∧ q) ≡ ¬p ∨ ¬q &nbsp;·&nbsp; ¬(p ∨ q) ≡ ¬p ∧ ¬q</span>
      <span class="formula">p ↔ q ≡ (p → q) ∧ (q → p)</span>
      <span class="formula">p ⊕ q ≡ (p ∨ q) ∧ ¬(p ∧ q)</span>
      <p>La première est la plus utile : elle transforme une implication en simple combinaison de OU et NON, donc en calcul.</p>
      <div class="ex">
        <span class="ex__tag">Vérification rapide de ¬(p → q)</span>
        <p>Un seul cas rend <span class="m">p → q</span> fausse : p vraie et q fausse. Sa négation est donc vraie exactement dans ce cas, c’est-à-dire <span class="m">p ∧ ¬q</span>.</p>
      </div>
    </div>

    <div class="card">
      <h3>Prédicats et quantificateurs</h3>
      <p>Un <strong>prédicat</strong> <span class="m">P(x)</span> est une phrase qui dépend de <span class="m">x</span> et devient une proposition quand on fixe <span class="m">x</span>. Exemple : <span class="m">P(x) : « x² ≥ 0 »</span>.</p>
      <ul>
        <li><span class="m">∀x ∈ E, P(x)</span> : pour tout x de E, P(x) est vraie. Un seul contre-exemple suffit à rendre l’énoncé faux.</li>
        <li><span class="m">∃x ∈ E, P(x)</span> : il existe au moins un x. Un seul exemple suffit à le rendre vrai.</li>
        <li><span class="m">∃!x ∈ E, P(x)</span> : il existe un unique x, ni zéro ni deux.</li>
      </ul>
      <span class="formula">¬(∀x, P(x)) ≡ ∃x, ¬P(x)<br>¬(∃x, P(x)) ≡ ∀x, ¬P(x)</span>
      <p><strong>Méthode</strong> : nier un quantificateur, c’est <strong>changer le symbole et nier le prédicat</strong>. Les deux opérations vont ensemble, sinon l’énoncé est faux.</p>
      <div class="ex">
        <span class="ex__tag">Exemple : deux quantificateurs</span>
        <p>« <span class="m">∀x ∈ ℝ, ∃y ∈ ℝ, y &gt; x</span> » est vrai : pour chaque x, on choisit y = x + 1.</p>
        <p>« <span class="m">∃y ∈ ℝ, ∀x ∈ ℝ, y &gt; x</span> » est faux : il faudrait un réel plus grand que tous les autres, ce qui n’existe pas.</p>
        <p>L’ordre change tout : dans le premier cas, y dépend de x ; dans le second, un même y doit convenir à tous les x.</p>
      </div>
    </div>

    <div class="card">
      <h3>Méthodes de démonstration</h3>
      <p>Quatre schémas couvrent presque tous les exercices :</p>
      <ol class="steps">
        <li><strong>Direct</strong> : on suppose p vraie, on en déduit q par calcul ou propriétés. C’est le plus fréquent.</li>
        <li><strong>Contraposée</strong> : on suppose ¬q et on démontre ¬p. Utile quand l’hypothèse de départ est peu exploitable.</li>
        <li><strong>Absurde</strong> : on suppose p vraie <em>et</em> q fausse, on aboutit à une contradiction. Très efficace pour l’irrationalité ou l’unicité.</li>
        <li><strong>Disjonction de cas</strong> : on sépare les possibilités (pair/impair, signe, positions) et on traite chacun.</li>
      </ol>
      <p>Pour <strong>réfuter</strong> un énoncé universel, un seul contre-exemple suffit : « tous les entiers pairs sont divisibles par 4 » tombe avec 6. Mais un exemple ne <strong>prouve</strong> jamais un « pour tout ».</p>
      <div class="ex">
        <span class="ex__tag">Mini-démonstration par contraposée</span>
        <p>Énoncé : si <span class="m">n²</span> est impair alors <span class="m">n</span> est impair.</p>
        <p>Contraposée : si <span class="m">n</span> est pair, alors <span class="m">n = 2k</span> et <span class="m">n² = 4k² = 2(2k²)</span>, donc <span class="m">n²</span> est pair. CQFD.</p>
      </div>
    </div>

    <div class="card">
      <h3>Tautologies, contradictions, satisfiabilité</h3>
      <ul>
        <li><strong>Tautologie</strong> : vraie sur toutes les lignes. Exemples : <span class="m">p ∨ ¬p</span> (tiers exclu), <span class="m">p → p</span>, <span class="m">(p ∧ (p → q)) → q</span>.</li>
        <li><strong>Contradiction</strong> : fausse sur toutes les lignes. Exemple : <span class="m">p ∧ ¬p</span>.</li>
        <li><strong>Satisfiable</strong> : vraie au moins une fois. Toute tautologie est satisfiable, l’inverse est faux.</li>
      </ul>
      <p>Deux propositions sont <strong>équivalentes</strong> quand <span class="m">p ↔ q</span> est une tautologie : même colonne dans la table de vérité.</p>
      <p>Application SLAM : une condition de test qui donne toujours vrai (<span class="m">if (x &gt; 0 || x ≤ 0)</span>) est une tautologie inutile ; toujours faux, c’est du code mort.</p>
    </div>`,

      <p>Un ensemble est une collection d’objets appelés éléments. On le note avec une majuscule : <span class="m">A, B, E</span>. L’univers <span class="m">E</span> est l’ensemble de référence dans lequel on travaille.</p>

const LETTERS = ['A', 'B', 'C', 'D'];

function mountQuiz(ch) {
  const root = document.getElementById('quiz-' + ch.id);
  const total = ch.quiz.length;
  let idx = 0, score = 0, locked = false;

  function draw() {
    const q = ch.quiz[idx];
    root.innerHTML =
      '<div class="quiz__meta">' +
        '<span class="quiz__count">Question ' + (idx + 1) + ' / ' + total + '</span>' +
        '<span class="quiz__count">Score ' + score + '</span>' +
      '</div>' +
      '<div class="quiz__q">' + q.q + '</div>' +
      '<div class="quiz__opts" role="group" aria-label="Réponses possibles">' +
        q.opts.map((o, i) =>
          '<button class="opt" type="button" data-i="' + i + '">' +
            '<span class="opt__key" aria-hidden="true">' + LETTERS[i] + '</span><span>' + o + '</span>' +
          '</button>').join('') +
      '</div>' +
      '<div class="feedback" aria-live="polite"></div>' +
      '<div class="quiz__foot"><button class="btn" type="button" data-next hidden>Question suivante</button></div>';
    root.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(parseInt(b.dataset.i, 10))));
    root.querySelector('[data-next]').addEventListener('click', () => {
      if (idx + 1 >= total) finish(); else { idx++; draw(); }
    });
    locked = false;
  }

  function answer(i) {
    if (locked) return;
    locked = true;
    const q = ch.quiz[idx];
    root.querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = true;
      if (k === q.a) b.classList.add('is-ok');
      if (k === i && i !== q.a) b.classList.add('is-bad');
    });
    const ok = i === q.a;
    if (ok) score++;
    const fb = root.querySelector('.feedback');
    fb.className = 'feedback show';
    fb.innerHTML = '<span class="feedback__verdict ' + (ok ? 'ok' : 'bad') + '">' +
      (ok ? 'Exact' : 'Raté, la bonne réponse est ' + LETTERS[q.a]) + '</span>' + q.why;
    root.querySelectorAll('.quiz__count')[1].textContent = 'Score ' + score;
    const nextBtn = root.querySelector('[data-next]');
    nextBtn.hidden = false;
    nextBtn.textContent = (idx + 1 >= total) ? 'Voir le résultat' : 'Question suivante';
  }

  function finish() {
    const pct = Math.round(score / total * 100);
    const prev = saved.scores[ch.id] || 0;
    if (pct > prev) saved.scores[ch.id] = pct;
    persist();
    updateProgress();
    const best = Math.max(pct, prev);
    const verdict = pct >= 90 ? 'Chapitre solide. Tu peux passer au suivant.'
      : pct >= 70 ? 'Acquis. Une deuxième passe demain pour verrouiller.'
      : pct >= 40 ? 'Fragile. Relis les pièges puis refais le quiz.'
      : 'À reprendre depuis l’essentiel. Le quiz se refait autant de fois que nécessaire.';
    root.innerHTML =
      '<div class="quiz__meta"><span class="quiz__count">Terminé</span><span class="quiz__count">Meilleur score ' + best + ' %</span></div>' +
      '<div class="quiz__q">' + score + ' / ' + total + ' · ' + pct + ' %</div>' +
      '<p>' + verdict + '</p>' +
      '<div class="quiz__foot"><button class="btn" type="button" data-retry>Refaire le quiz</button></div>';
    root.querySelector('[data-retry]').addEventListener('click', () => {
      idx = 0; score = 0; draw();
    });
  }

  draw();
}

/* ==========================================================================
   MATH HELPERS
   ========================================================================== */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }

function euclid(a, b) {
  const steps = [];
  if (b === 0) return { g: a, steps: ['pgcd(' + a + ', 0) = ' + a] };
  while (b !== 0) {
    const q = Math.floor(a / b);
    const r = a % b;
    steps.push(a + ' = ' + b + ' × ' + q + ' + ' + r);
    a = b; b = r;
  }
  return { g: a, steps: steps };
}

const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function sup(n) { return String(n).split('').map(d => SUP[d] || d).join(''); }

function factorize(n) {
  n = Math.abs(Math.round(n));
  if (n < 2) return [];
  const out = [];
  for (let p = 2; p * p <= n; p++) {
    let e = 0;
    while (n % p === 0) { n /= p; e++; }
    if (e) out.push([p, e]);
  }
  if (n > 1) out.push([n, 1]);
  return out;
}
function factorStr(list) {
  if (!list.length) return '1';
  return list.map(function (f) { return f[1] === 1 ? String(f[0]) : f[0] + sup(f[1]); }).join(' × ');
}
function fracStr(num, den) {
  if (den === 0) return '∞';
  if (den < 0) { num = -num; den = -den; }
  const g = gcd(num, den) || 1;
  num /= g; den /= g;
  return den === 1 ? String(num) : num + '/' + den;
}
function num(v) { return '<span class="v">' + v + '</span>'; }
