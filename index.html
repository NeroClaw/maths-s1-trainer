const RUNNERS = {};

function readInt(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  const v = parseFloat(el.value.replace(',', '.'));
  return Number.isFinite(v) ? v : null;
}

RUNNERS.arith = function () {
  const a = readInt('aA'), b = readInt('aB'), n = readInt('aN');
  const out = document.getElementById('out-arith');
  if (a === null || b === null || !Number.isInteger(a) || !Number.isInteger(b) || b === 0) {
    out.textContent = 'Il faut deux entiers, avec b ≠ 0.';
    return;
  }
  const A = Math.abs(a), B = Math.abs(b);
  const e = euclid(A, B);
  const g = e.g || 1;
  const l = (A / g) * B;
  const lines = [];
  lines.push('<span class="k">PGCD</span> = ' + num(g) + '   <span class="k">PPCM</span> = ' + num(l));
  lines.push('<span class="k">Euclide</span>');
  e.steps.forEach(s => lines.push('  <span class="step">' + s + '</span>'));
  lines.push('<span class="k">Décomposition</span>');
  lines.push('  ' + A + ' = <span class="step">' + factorStr(factorize(A)) + '</span>');
  lines.push('  ' + B + ' = <span class="step">' + factorStr(factorize(B)) + '</span>');
  lines.push('<span class="k">Fraction</span> ' + a + '/' + b + ' = ' + num(fracStr(a, b)));
  if (n && Number.isInteger(n) && n > 1) {
    const ma = ((a % n) + n) % n;
    const mb = ((b % n) + n) % n;
    lines.push('<span class="k">Modulo ' + n + '</span> ' + a + ' ≡ ' + num(ma) + '   ·   ' + b + ' ≡ ' + num(mb));
    lines.push('  <span class="step">' + a + ' × ' + b + ' ≡ ' + ((ma * mb) % n) + ' [' + n + ']</span>');
  }
  out.innerHTML = lines.join('<br>');
};

function parseBaseToBigInt(str, base) {
  const clean = String(str).trim().toUpperCase().replace(/[\s_]/g, '');
  if (!clean) return null;
  let v = 0n;
  for (const c of clean) {
    const d = '0123456789ABCDEF'.indexOf(c);
    if (d < 0 || d >= base) return null;
    v = v * BigInt(base) + BigInt(d);
  }
  return v;
}
function toBaseBig(v, base) {
  if (v === 0n) return '0';
  const digits = '0123456789ABCDEF';
  const B = BigInt(base);
  let s = '';
  while (v > 0n) { s = digits[Number(v % B)] + s; v /= B; }
  return s;
}
function group4(bits) {
  let out = '';
  const pad = bits.padStart(Math.ceil(bits.length / 4) * 4, '0');
  for (let i = 0; i < pad.length; i += 4) out += pad.slice(i, i + 4) + ' ';
  return out.trim();
}

RUNNERS.num = function () {
  const raw = document.getElementById('nVal').value;
  const from = parseInt(document.getElementById('nFrom').value, 10);
  const to = parseInt(document.getElementById('nTo').value, 10);
  const out = document.getElementById('out-num');
  const v = parseBaseToBigInt(raw, from);
  if (v === null) {
    out.innerHTML = '<span class="step">Chiffre invalide pour la base ' + from + '. Les chiffres autorisés vont de 0 à ' + (from - 1) + '.</span>';
    return;
  }
  const lines = [];
  const clean = raw.trim().toUpperCase().replace(/[\s_]/g, '');
  if (clean.length <= 10) {
    const detail = clean.split('').reverse().map(function (c, i) {
      return '  <span class="step">' + c + ' × ' + from + sup(i) + ' = ' + Number(BigInt(parseInt(c, 16)) * (BigInt(from) ** BigInt(i))) + '</span>';
    }).join('<br>');
    lines.push('<span class="k">Décomposition</span>');
    lines.push(detail);
  }
  lines.push('<span class="k">Décimal</span> = ' + num(v.toString()));
  const bin = toBaseBig(v, 2);
  lines.push('<span class="k">Base ' + to + '</span> = ' + num(toBaseBig(v, to)));
  lines.push('<span class="k">Binaire</span> ' + bin);
  lines.push('<span class="k">Groupé 4 bits</span> <span class="step">' + group4(bin) + '</span>');
  lines.push('<span class="k">Hexadécimal</span> ' + toBaseBig(v, 16));
  out.innerHTML = lines.join('<br>');
};

RUNNERS.c2 = function () {
  const v = readInt('nSign');
  const bits = parseInt(document.getElementById('nBits').value, 10);
  const out = document.getElementById('out-c2');
  if (v === null || !Number.isInteger(v)) { out.textContent = 'Entier attendu.'; return; }
  const B = BigInt(bits);
  const min = -(1n << (B - 1n));
  const max = (1n << (B - 1n)) - 1n;
  const val = BigInt(v);
  if (val < min || val > max) {
    out.innerHTML = '<span class="step">Hors plage : sur ' + bits + ' bits signés, on va de ' + min + ' à ' + max + '.</span>';
    return;
  }
  const rep = val >= 0n ? val : (1n << B) + val;
  const bin = rep.toString(2).padStart(bits, '0');
  const lines = [];
  if (val < 0n) {
    const abs = (-val).toString(2).padStart(bits, '0');
    const inv = abs.split('').map(b => (b === '0' ? '1' : '0')).join('');
    lines.push('<span class="k">1. ' + (-val) + ' sur ' + bits + ' bits</span> <span class="step">' + group4(abs) + '</span>');
    lines.push('<span class="k">2. bits inversés</span> <span class="step">' + group4(inv) + '</span>');
    lines.push('<span class="k">3. + 1</span> <span class="step">' + group4(bin) + '</span>');
  }
  lines.push('<span class="k">Complément à 2</span> ' + num(group4(bin)));
  lines.push('<span class="k">Hexadécimal</span> ' + toBaseBig(rep, 16).toUpperCase().padStart(bits / 4, '0'));
  lines.push('<span class="k">Bit de poids fort</span> ' + (bin[0] === '1' ? '1, donc négatif' : '0, donc positif'));
  out.innerHTML = lines.join('<br>');
};

/* --- logique : lexer + parser --- */
function lex(srcRaw) {
  let src = String(srcRaw).replace(/\s+/g, ' ');
  src = src.replace(/\bou\b/gi, '∨').replace(/\bet\b/gi, '∧').replace(/\bnon\b/gi, '¬')
           .replace(/\bor\b/gi, '∨').replace(/\band\b/gi, '∧').replace(/\bnot\b/gi, '¬');
  src = src.replace(/\s+/g, '');
  const ops = ['<->', '<=>', '↔', '->', '=>', '→', '&&', '||', '∧', '∨', '&', '|', '^', '!', '~', '¬', '(', ')'];
  const norm = { '<->': '↔', '<=>': '↔', '↔': '↔', '->': '→', '=>': '→', '→': '→', '&&': '∧', '∧': '∧', '&': '∧', '^': '∧', '||': '∨', '∨': '∨', '|': '∨', '!': '¬', '~': '¬', '¬': '¬', '(': '(', ')': ')' };
  const tokens = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/[A-Za-z]/.test(c)) { tokens.push({ t: 'var', v: c.toLowerCase() }); i++; continue; }
    if (c === '1' || c === '0') { tokens.push({ t: 'const', v: c }); i++; continue; }
    let matched = null;
    for (const op of ops) { if (src.startsWith(op, i)) { matched = op; break; } }
    if (!matched) throw new Error('caractère inconnu : ' + c);
    tokens.push({ t: 'op', v: norm[matched] });
    i += matched.length;
  }
  return tokens;
}

function parseLogic(tokens) {
  let pos = 0;
  function peek() { return tokens[pos]; }
  function eat(v) {
    const t = tokens[pos];
    if (t && t.t === 'op' && t.v === v) { pos++; return true; }
    return false;
  }
  function parseEquiv() {
    let left = parseImpl();
    while (peek() && peek().t === 'op' && peek().v === '↔') { pos++; left = { op: '↔', a: left, b: parseImpl() }; }
    return left;
  }
  function parseImpl() {
    const left = parseOr();
    if (peek() && peek().t === 'op' && peek().v === '→') { pos++; return { op: '→', a: left, b: parseImpl() }; }
    return left;
  }
  function parseOr() {
    let left = parseAnd();
    while (peek() && peek().t === 'op' && peek().v === '∨') { pos++; left = { op: '∨', a: left, b: parseAnd() }; }
    return left;
  }
  function parseAnd() {
    let left = parseNot();
    while (peek() && peek().t === 'op' && peek().v === '∧') { pos++; left = { op: '∧', a: left, b: parseNot() }; }
    return left;
  }
  function parseNot() {
    if (peek() && peek().t === 'op' && peek().v === '¬') { pos++; return { op: '¬', a: parseNot() }; }
    return parseAtom();
  }
  function parseAtom() {
    const t = peek();
    if (!t) throw new Error('expression incomplète');
    if (t.t === 'var') { pos++; return { v: t.v }; }
    if (t.t === 'const') { pos++; return { op: t.v }; }
    if (t.t === 'op' && t.v === '(') {
      pos++;
      const e = parseEquiv();
      if (!eat(')')) throw new Error('parenthèse fermante manquante');
      return e;
    }
    throw new Error('symbole inattendu : ' + t.v);
  }
  const ast = parseEquiv();
  if (pos !== tokens.length) throw new Error('reste de l’expression non lu');
  return ast;
}

function evalLogic(ast, env) {
  if (ast.v !== undefined) return env[ast.v];
  if (ast.op === '¬') return !evalLogic(ast.a, env);
  if (ast.op === '1') return true;
  if (ast.op === '0') return false;
  const a = evalLogic(ast.a, env), b = evalLogic(ast.b, env);
  if (ast.op === '∧') return a && b;
  if (ast.op === '∨') return a || b;
  if (ast.op === '→') return !a || b;
  if (ast.op === '↔') return a === b;
  return false;
}

RUNNERS.log = function () {
  const out = document.getElementById('out-log');
  const expr = document.getElementById('logExpr').value;
  let tokens, ast;
  try {
    tokens = lex(expr);
    ast = parseLogic(tokens);
  } catch (err) {
    out.innerHTML = '<span class="step">Erreur de syntaxe : ' + err.message + '</span>';
    return;
  }
  const vars = [];
  tokens.forEach(t => { if (t.t === 'var' && vars.indexOf(t.v) < 0) vars.push(t.v); });
  vars.sort();
  if (!vars.length) { out.innerHTML = '<span class="step">Ajoute au moins une variable (p, q, r).</span>'; return; }
  if (vars.length > 5) { out.innerHTML = '<span class="step">Maximum 5 variables (32 lignes).</span>'; return; }

  const rows = [];
  const n = vars.length;
  for (let m = 0; m < Math.pow(2, n); m++) {
    const env = {};
    vars.forEach(function (v, i) { env[v] = !!(m & (1 << (n - 1 - i))); });
    rows.push({ env: env, res: evalLogic(ast, env) });
  }
  const trueCount = rows.filter(r => r.res).length;

  let html = '<table class="tt"><thead><tr>';
  vars.forEach(v => { html += '<th>' + v + '</th>'; });
  html += '<th>' + expr.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr' + (r.res ? ' class="t"' : '') + '>';
    vars.forEach(v => { html += '<td>' + (r.env[v] ? 'V' : 'F') + '</td>'; });
    html += '<td>' + (r.res ? 'V' : 'F') + '</td></tr>';
  });
  html += '</tbody></table>';
  const verdict = trueCount === rows.length ? '<span class="v">Tautologie</span> : vraie sur toutes les lignes.'
    : trueCount === 0 ? '<span class="v">Contradiction</span> : fausse sur toutes les lignes.'
    : '<span class="v">Contingence</span> : vraie sur ' + trueCount + ' ligne(s) sur ' + rows.length + '.';
  out.innerHTML = html + '<p style="margin-block:1rem 0">' + verdict + '</p>';
};

RUNNERS.ens = function () {
  const A = readInt('eA'), B = readInt('eB'), I = readInt('eI'), E = readInt('eE');
  const out = document.getElementById('out-ens');
  if (A === null || B === null || I === null) { out.textContent = 'Trois entiers attendus.'; return; }
  if (I > Math.min(A, B) || I < 0) { out.innerHTML = '<span class="step">|A ∩ B| ne peut pas dépasser min(|A|, |B|).</span>'; return; }
  const U = A + B - I;
  const lines = [];
  lines.push('<span class="k">|A ∪ B|</span> = ' + A + ' + ' + B + ' − ' + I + ' = ' + num(U));
  lines.push('<span class="k">A seul</span> = ' + num(A - I) + '   <span class="k">B seul</span> = ' + num(B - I));
  lines.push('<span class="k">Dans les deux</span> = ' + num(I));
  if (E && E >= U) {
    lines.push('<span class="k">Ni A ni B</span> = ' + E + ' − ' + U + ' = ' + num(E - U));
  } else if (E) {
    lines.push('<span class="step">|E| est plus petit que |A ∪ B| : vérifie l’énoncé.</span>');
  }
  lines.push('<span class="k">Contrôle</span> <span class="step">' + (A - I) + ' + ' + (B - I) + ' + ' + I + ' + ' + (E && E >= U ? E - U : 0) + ' = ' + (E && E >= U ? E : U) + '</span>');
  out.innerHTML = lines.join('<br>');
};

RUNNERS.powerset = function () {
  const n = readInt('eN');
  const out = document.getElementById('out-powerset');
  if (n === null || !Number.isInteger(n) || n < 0 || n > 60) { out.textContent = 'Entier entre 0 et 60 attendu.'; return; }
  const total = 1n << BigInt(n);
  out.innerHTML = '<span class="k">|P(E)|</span> = 2' + sup(n) + ' = ' + num(total.toString()) + ' sous-ensembles' +
    '<br><span class="step">En comptant l’ensemble vide et E lui-même.</span>';
};
