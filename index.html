<style>
/* ==========================================================================
   01. TOKENS
   ========================================================================== */
:root {
  --paper: #f6f3ec;

  --radius: 14px;
  --radius-sm: 9px;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;

  --space-7: 3rem;
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;

  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;

}

  --ink: #e9e6e0;
  --muted: #9aa3af;
  --line: #2a313a;
  --accent: #e2743f;
  --accent-soft: #33231b;
  --on-accent: #14171c;
  --ok: #4cc4a3;
  --ok-soft: #1b3a33;
  --bad: #e5746b;
  --bad-soft: #3a201e;
  --warn: #d9a53f;
  --shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.8);
}

/* ==========================================================================
   02. RESET & BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
p { margin: 0 0 var(--space-3); }
ul, ol { margin: 0 0 var(--space-3); padding-inline-start: 1.25rem; }

strong { font-weight: 600; }
code, .m {

}

button { font: inherit; color: inherit; }

.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: var(--space-4); }

/* ==========================================================================
   03. HEADER
   ========================================================================== */
.top {

.trap {

/* ==========================================================================
   06. CALCULATORS
   ========================================================================== */
.calc { background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--radius); padding: var(--space-4); }
.calc__grid { display: grid; gap: var(--space-3); grid-template-columns: 1fr; }
@media (min-width: 520px) { .calc__grid { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); } }
.field { display: flex; flex-direction: column; gap: var(--space-1); }
.field label { font-size: var(--fs-xs); color: var(--muted); font-weight: 500; }
input[type="number"], input[type="text"], select {
  font-family: var(--font-mono); font-size: var(--fs-sm);
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 0.6rem 0.7rem;

input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);

  background: var(--accent); color: var(--on-accent);
  border: 1px solid var(--accent); border-radius: var(--radius-sm);
  font-weight: 600; font-size: var(--fs-sm); cursor: pointer;
  transition: transform 0.2s, filter 0.2s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(1px); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--line); }

.calc__actions { margin-block-start: var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-2); }

table.tt { border-collapse: collapse; font-family: var(--font-mono); font-size: var(--fs-sm); margin-block-start: var(--space-3); width: 100%; }
table.tt th, table.tt td { border: 1px solid var(--line); padding: 0.35rem 0.55rem; text-align: center; }
table.tt th { background: var(--surface-2); font-weight: 600; }

/* ==========================================================================

   ========================================================================== */

.opt {
  text-align: start; width: 100%; min-height: 48px;
  padding: var(--space-3);
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); cursor: pointer;

.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.opt__key {
  font-size: 0.68rem; width: 18px; height: 18px; flex: none;
  display: grid; place-items: center;
  border-radius: 4px; background: var(--surface); border: 1px solid var(--line);
  color: var(--muted);
}
.feedback { margin-block-start: var(--space-3); font-size: var(--fs-sm); display: none; }
.feedback.show { display: block; animation: fade 0.25s; }
.feedback__verdict { font-weight: 600; display: block; margin-block-end: var(--space-1); }
.feedback__verdict.ok { color: var(--ok); }
.feedback__verdict.bad { color: var(--bad); }
.quiz__foot { margin-block-start: var(--space-4); display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.score { font-family: var(--font-mono); font-size: var(--fs-sm); }

.flashdeck { display: grid; gap: var(--space-2); }
@media (min-width: 700px) { .flashdeck { grid-template-columns: 1fr 1fr; } }
.flash {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; text-align: start;
  padding: var(--space-3); width: 100%; min-height: 52px;
  transition: border-color 0.2s, background 0.2s;
}
.flash:hover { border-color: var(--accent); }
.flash__recto { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 600; display: block; }
.flash__verso {
  display: none; font-size: var(--fs-sm); color: var(--muted);
  margin-block-start: var(--space-2); padding-block-start: var(--space-2);
  border-block-start: 1px dashed var(--line);
}
.flash[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); }
.flash[aria-expanded="true"] .flash__verso { display: block; }
.flash__hint { font-size: 0.68rem; color: var(--muted); margin-block-start: var(--space-1); display: block; }
.flash[aria-expanded="true"] .flash__hint { display: none; }

/* ==========================================================================
   08. MEMO / PRINT
   ========================================================================== */
.memo-grid { display: grid; gap: var(--space-3); }
@media (min-width: 700px) { .memo-grid { grid-template-columns: 1fr 1fr; } }
.memo-card { break-inside: avoid; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {

@media print {

  .flash__verso { display: block !important; }

<script>
const CHAPTERS = [
{
  id: 'arith',
  num: '01',
  title: 'Arithmétique',
  tagline: 'Divisibilité, division euclidienne, PGCD/PPCM, congruences. Le chapitre qui tombe presque toujours en exercice 1.',
  essentiel: `
    <div class="card">
      <h3>Divisibilité</h3>
      <p><span class="m">a | b</span> se lit "a divise b" : il existe un entier <span class="m">k</span> tel que <span class="m">b = k × a</span>. C'est a qui est le diviseur.</p>
      <ul>
        <li>1 divise tout entier, et tout entier non nul divise 0.</li>
        <li>Si <span class="m">a | b</span> et <span class="m">b | c</span> alors <span class="m">a | c</span> (transitivité).</li>
        <li>Si <span class="m">a | b</span> et <span class="m">a | c</span> alors <span class="m">a | (b + c)</span> et <span class="m">a | (b − c)</span>.</li>
      </ul>
      <p><strong>Critères à connaître par cœur</strong> : 2 (dernier chiffre pair) · 3 (somme des chiffres divisible par 3) · 4 (deux derniers chiffres) · 5 (finit par 0 ou 5) · 9 (somme des chiffres) · 10 · 11 (somme alternée des chiffres).</p>
    </div>
    <div class="card">
      <h3>Division euclidienne</h3>
      <p>Pour <span class="m">a ∈ ℤ</span> et <span class="m">b ∈ ℕ*</span>, il existe un unique couple <span class="m">(q, r)</span> tel que :</p>
      <span class="formula">a = b × q + r &nbsp;&nbsp;avec&nbsp;&nbsp; 0 ≤ r &lt; b</span>
      <p>Le reste est <strong>toujours positif ou nul</strong>, même quand a est négatif. Exemple : <span class="m">−17 = 5 × (−4) + 3</span>, donc <span class="m">q = −4</span> et <span class="m">r = 3</span>.</p>
    </div>
    <div class="card">
      <h3>PGCD et PPCM</h3>
      <span class="formula">pgcd(a, b) × ppcm(a, b) = a × b</span>
      <p><strong>Algorithme d'Euclide</strong> : on remplace <span class="m">(a, b)</span> par <span class="m">(b, r)</span> tant que <span class="m">r ≠ 0</span>. Le dernier reste non nul est le PGCD.</p>
      <p><strong>Par décomposition</strong> : PGCD = produit des facteurs communs pris avec le <em>plus petit</em> exposant. PPCM = produit de tous les facteurs pris avec le <em>plus grand</em> exposant.</p>
    </div>
    <div class="card">
      <h3>Congruences</h3>
      <span class="formula">a ≡ b [n] &nbsp;⇔&nbsp; n | (a − b) &nbsp;⇔&nbsp; a et b ont le même reste modulo n</span>
      <p>On peut additionner, soustraire et multiplier des congruences membre à membre, et élever à une puissance. Exemple : <span class="m">2⁵ = 32 ≡ 1 [31]</span>.</p>
      <p><strong>Applications BTS</strong> : clés de contrôle (EAN-13, ISBN, NIR), tests de parité, chiffrement RSA, numérotation de boucles algorithmiques.</p>
    </div>
    <div class="card">
      <h3>Nombres premiers</h3>

  essentiel: `
    <div class="card">
      <h3>Valeur d’un nombre en base b</h3>
      <span class="formula">N = d_n × bⁿ + … + d₂ × b² + d₁ × b + d₀</span>
      <p>Les chiffres vont de 0 à <span class="m">b − 1</span>. En base 16 on utilise 0 à 9 puis A, B, C, D, E, F pour 10 à 15.</p>
      <p>Exemple : <span class="m">1011₂ = 1×8 + 0×4 + 1×2 + 1×1 = 11</span>.</p>
    </div>
    <div class="card">
      <h3>Conversion vers une base b</h3>
      <p><strong>Divisions successives</strong> par <span class="m">b</span> : on note les restes, puis on les lit <strong>de bas en haut</strong>. Le dernier quotient non nul devient le chiffre de tête.</p>
      <p>Exemple : 45 en base 2 donne les restes 1, 0, 1, 1, 0, 1 lus à l’envers, soit <span class="m">101101₂</span>.</p>
    </div>
    <div class="card">
      <h3>Binaire et hexadécimal</h3>
      <p>Un chiffre hexadécimal = exactement <strong>4 bits</strong>. On regroupe par paquets de 4 en partant de la droite.</p>
      <span class="formula">1101 0110₂ = D6₁₆ &nbsp;&nbsp;·&nbsp;&nbsp; 1010₂ = A₁₆ = 10</span>
      <p>Utilité : couleurs web, adresses MAC, masques réseau, codes d’erreur.</p>
    </div>
    <div class="card">
      <h3>Entiers signés sur n bits</h3>
      <p>Non signé : <span class="m">0</span> à <span class="m">2ⁿ − 1</span>. En complément à 2 : <span class="m">−2ⁿ⁻¹</span> à <span class="m">2ⁿ⁻¹ − 1</span>.</p>
      <p><strong>Méthode</strong> : pour écrire <span class="m">−x</span>, on code <span class="m">x</span> sur n bits, on inverse tous les bits, puis on ajoute 1.</p>
      <span class="formula">−5 sur 8 bits : 0000 0101 → 1111 1010 → 1111 1011</span>
      <p>Le bit de poids fort vaut 1 si le nombre est négatif. Sur 8 bits signés : <span class="m">127 + 1 = −128</span> (dépassement).</p>
    </div>
    <div class="card">
      <h3>Tailles mémoire</h3>
      <p>1 octet = 8 bits · 1 kio = 1024 octets · 1 Mio = 1024 kio · 1 Gio = 1024 Mio.</p>
      <p>Un entier 32 bits non signé monte à 4 294 967 295. Un flottant simple précision occupe 32 bits : 1 signe, 8 exposant (biais 127), 23 mantisse.</p>
    </div>`,

    <div class="trap"><span class="trap__flag">ordre</span><p>Les restes se lisent du <strong>dernier au premier</strong>. Les écrire dans l’ordre de calcul donne le nombre à l’envers.</p></div>
    <div class="trap"><span class="trap__flag">chiffres</span><p>En base 2, il n’existe que 0 et 1. Écrire <span class="m">102</span> en base 2 est une faute immédiate. En base 8, le chiffre 9 est interdit.</p></div>

{
  id: 'mat',
  num: '03',
  title: 'Matrices',
  tagline: 'Produit, déterminant, inverse, systèmes linéaires et matrices d’adjacence. C’est le chapitre le plus rentable en points.',
  essentiel: `
    <div class="card">
      <h3>Vocabulaire</h3>
      <p>Une matrice <span class="m">A</span> de dimension <span class="m">m × n</span> a <em>m lignes</em> et <em>n colonnes</em>. Le coefficient <span class="m">aᵢⱼ</span> est à la ligne i, colonne j.</p>
      <p>Matrice carrée : même nombre de lignes et de colonnes. Matrice identité <span class="m">Iₙ</span> : des 1 sur la diagonale, des 0 ailleurs.</p>
    </div>
    <div class="card">
      <h3>Somme et multiplication par un réel</h3>
      <p>La somme exige des dimensions identiques : on ajoute coefficient par coefficient. Pour <span class="m">k × A</span>, on multiplie chaque coefficient par k.</p>
    </div>
    <div class="card">
      <h3>Produit de matrices</h3>
      <p><strong>Condition</strong> : le nombre de colonnes de A doit égaler le nombre de lignes de B.</p>
      <span class="formula">(m × n) · (n × p) = (m × p)</span>
      <p>Le coefficient <span class="m">cᵢⱼ</span> = somme des produits de la <strong>ligne i de A</strong> par la <strong>colonne j de B</strong> :</p>
      <span class="formula">cᵢⱼ = aᵢ₁b₁ⱼ + aᵢ₂b₂ⱼ + … + aᵢₙbₙⱼ</span>
      <p>Le produit n’est pas commutatif : <span class="m">AB ≠ BA</span> en général. Et <span class="m">AB = 0</span> n’implique pas <span class="m">A = 0</span> ou <span class="m">B = 0</span>.</p>
    </div>
    <div class="card">
      <h3>Déterminant</h3>
      <span class="formula">det [[a, b], [c, d]] = ad − bc</span>
      <p><strong>3 × 3, règle de Sarrus</strong> : recopier les deux premières colonnes à droite, puis somme des trois diagonales descendantes <strong>moins</strong> somme des trois diagonales montantes.</p>
      <p>Propriétés : <span class="m">det(AB) = det(A) × det(B)</span> et <span class="m">det(Aᵀ) = det(A)</span>.</p>
    </div>
    <div class="card">
      <h3>Inverse d’une matrice 2 × 2</h3>
      <p>A est inversible si et seulement si <span class="m">det(A) ≠ 0</span>. Alors :</p>
      <span class="formula">A⁻¹ = 1/(ad − bc) × [[d, −b], [−c, a]]</span>
      <p>On échange a et d, on change le signe de b et c.</p>
    </div>
    <div class="card">
      <h3>Systèmes linéaires</h3>
      <p>Un système s’écrit <span class="m">AX = B</span>. Si A est inversible :</p>
      <span class="formula">X = A⁻¹ × B</span>
      <p>Attention à l’ordre : on multiplie A⁻¹ <strong>à gauche</strong>.</p>
    </div>
    <div class="card">
      <h3>Matrices et graphes</h3>
      <p>Pour un graphe à n sommets, la matrice d’adjacence M est carrée d’ordre n : <span class="m">mᵢⱼ = 1</span> s’il existe une arête de i vers j.</p>
      <p>Le coefficient <span class="m">(Mᵏ)ᵢⱼ</span> donne le <strong>nombre de chemins de longueur k</strong> allant de i à j. C’est la question classique du sujet SLAM.</p>
    </div>`,
  pieges: `
    <div class="trap"><span class="trap__flag">ordre</span><p><span class="m">AB</span> et <span class="m">BA</span> ne donnent pas la même matrice, et l’un peut exister sans l’autre. Toujours vérifier les dimensions avant de calculer.</p></div>
    <div class="trap"><span class="trap__flag">condition</span><p>Pour <span class="m">A (2×3)</span> et <span class="m">B (2×3)</span>, le produit AB n’existe pas : il faut 3 = 2. C’est BA qui est calculable (3×2 · 2×3 = 3×3).</p></div>
    <div class="trap"><span class="trap__flag">Sarrus</span><p>Les trois diagonales montantes sont <strong>soustraites</strong>. Oublier un signe fait perdre tout le calcul.</p></div>
    <div class="trap"><span class="trap__flag">inverse</span><p>Dans <span class="m">[[d, −b], [−c, a]]</span>, les signes moins sont sur b et c, pas sur a et d. Et on divise par le déterminant, on ne le multiplie pas.</p></div>
    <div class="trap"><span class="trap__flag">A⁻¹B</span><p>Dans <span class="m">AX = B</span>, on multiplie par A⁻¹ à gauche des deux côtés. Écrire <span class="m">X = BA⁻¹</span> est faux.</p></div>
    <div class="trap"><span class="trap__flag">det = 0</span><p>Déterminant nul signifie non inversible, pas "matrice nulle". Ne pas conclure que tous les coefficients sont nuls.</p></div>`,

    { r: 'cᵢⱼ', v: 'Ligne i de A fois colonne j de B, produits sommés.' },

    { r: 'A⁻¹ (2×2)', v: '1/det × [[d, −b], [−c, a]], si det ≠ 0.' },
    { r: 'AX = B', v: 'X = A⁻¹B, multiplication à gauche.' },
    { r: 'Mᵏ', v: 'Coefficient (i, j) = nombre de chemins de longueur k de i vers j.' }

  quiz: [
    { q: 'det [[3, 5], [2, 4]] = ?', opts: ['2', '22', '−2', '12'], a: 0, why: 'ad − bc = 3 × 4 − 5 × 2 = 12 − 10 = 2.' },

    { q: 'Si det(A) = 0, alors :', opts: ['A n’est pas inversible', 'A est la matrice nulle', 'A⁻¹ = 0', 'A est diagonale'], a: 0, why: 'Le déterminant nul est exactement le critère de non-inversibilité. Cela n’impose rien sur les coefficients pris un par un.' },
    { q: 'A⁻¹ pour A = [[1, 2], [3, 4]] vaut :', opts: ['[[−2, 1], [1,5, −0,5]]', '[[4, −2], [−3, 1]]', '[[4, 2], [3, 1]]', 'A n’est pas inversible'], a: 0, why: 'det = −2. Donc 1/(−2) × [[4, −2], [−3, 1]] = [[−2, 1], [1,5, −0,5]].' },
    { q: 'Le coefficient (2,1) de M² compte :', opts: ['Les chemins de longueur 2 du sommet 2 vers le sommet 1', 'Les arêtes entre 1 et 2', 'Le degré du sommet 2', 'Les chemins de longueur 1 de 1 vers 2'], a: 0, why: 'Mᵏ donne les chemins de longueur k, ligne = départ, colonne = arrivée.' },
    { q: 'AB = 0 implique :', opts: ['Rien de particulier sur A et B', 'A = 0 ou B = 0', 'A et B sont inversibles', 'BA = 0'], a: 0, why: 'Contrairement aux réels, un produit de matrices peut être nul sans qu’aucun facteur le soit.' },
    { q: 'Dans AX = B avec A inversible, X vaut :', opts: ['A⁻¹B', 'BA⁻¹', 'B/A', 'A B⁻¹'], a: 0, why: 'On multiplie à gauche par A⁻¹ : A⁻¹AX = A⁻¹B, donc X = A⁻¹B.' },
    { q: 'det(AB) vaut :', opts: ['det(A) × det(B)', 'det(A) + det(B)', 'det(A) − det(B)', 'det(BA) seulement si AB = BA'], a: 0, why: 'Le déterminant est multiplicatif. Et det(BA) = det(B)det(A) = det(AB) sans condition de commutativité.' }
  ]

{
  id: 'log',
  num: '04',
  title: 'Propositions',
  tagline: 'Connecteurs, tables de vérité, implications, quantificateurs. Beaucoup de points faciles si les tables sont sues.',
  essentiel: `
    <div class="card">
      <h3>Connecteurs</h3>
      <ul>
        <li><span class="m">¬p</span> : négation, inverse la valeur de vérité.</li>
        <li><span class="m">p ∧ q</span> : ET, vrai seulement si les deux sont vraies.</li>
        <li><span class="m">p ∨ q</span> : OU inclusif, faux seulement si les deux sont fausses.</li>
        <li><span class="m">p ⊕ q</span> : OU exclusif, vrai si une seule est vraie.</li>
        <li><span class="m">p → q</span> : implication, fausse <strong>uniquement</strong> quand p est vraie et q fausse.</li>
        <li><span class="m">p ↔ q</span> : équivalence, vraie quand les deux ont la même valeur.</li>
      </ul>
    </div>
    <div class="card">
      <h3>Table de vérité</h3>
      <p>Avec n propositions distinctes, la table a <span class="m">2ⁿ</span> lignes. On remplit les colonnes de gauche à droite, en alternant les vrai/faux (la variable la plus à gauche change le moins souvent).</p>
    </div>
    <div class="card">
      <h3>Implication et contraposée</h3>
      <span class="formula">(p → q) ≡ (¬q → ¬p)</span>
      <p>La contraposée est <strong>toujours équivalente</strong>. Ce n’est pas le cas de la réciproque <span class="m">(q → p)</span> ni du contraire <span class="m">(¬p → ¬q)</span>.</p>
      <p>Vocabulaire : p est une condition <em>suffisante</em> pour q, q est une condition <em>nécessaire</em> pour p.</p>
    </div>
    <div class="card">
      <h3>Règles de De Morgan</h3>
      <span class="formula">¬(p ∧ q) ≡ ¬p ∨ ¬q &nbsp;&nbsp;·&nbsp;&nbsp; ¬(p ∨ q) ≡ ¬p ∧ ¬q</span>
      <span class="formula">¬(p → q) ≡ p ∧ ¬q</span>
      <p>La négation d’une implication garde l’antécédent vrai et nie la conclusion. C’est le piège numéro un.</p>
    </div>
    <div class="card">
      <h3>Prédicats et quantificateurs</h3>
      <p><span class="m">P(x)</span> est un prédicat : une phrase qui dépend de x et devient une proposition quand on fixe x.</p>
      <ul>
        <li><span class="m">∀x ∈ E, P(x)</span> : pour tout x.</li>
        <li><span class="m">∃x ∈ E, P(x)</span> : il existe au moins un x.</li>
        <li><span class="m">∃!x ∈ E, P(x)</span> : il existe un unique x.</li>
      </ul>
      <span class="formula">¬(∀x, P(x)) ≡ ∃x, ¬P(x) &nbsp;&nbsp;·&nbsp;&nbsp; ¬(∃x, P(x)) ≡ ∀x, ¬P(x)</span>
      <p>Nier un quantificateur, c’est <strong>changer le quantificateur et nier le prédicat</strong>.</p>
      <p><span class="m">∀x ∃y</span> laisse y dépendre de x ; <span class="m">∃y ∀x</span> impose un même y pour tous les x. Ce n’est pas la même chose.</p>
    </div>
    <div class="card">
      <h3>Types de raisonnement</h3>
      <ul>
        <li><strong>Direct</strong> : on suppose p et on démontre q.</li>
        <li><strong>Contraposée</strong> : on suppose ¬q et on démontre ¬p. Même implication.</li>
        <li><strong>Absurde</strong> : on suppose p et ¬q, on arrive à une contradiction.</li>
        <li><strong>Contre-exemple</strong> : un seul cas qui échoue suffit à réfuter un "pour tout".</li>
        <li><strong>Disjonction de cas</strong> : on sépare les possibilités et on traite chacune.</li>
      </ul>
    </div>`,
  pieges: `
    <div class="trap"><span class="trap__flag">¬(p→q)</span><p>La négation n’est pas <span class="m">¬p → ¬q</span> ni <span class="m">¬p ∧ ¬q</span>. C’est <span class="m">p ∧ ¬q</span> : l’hypothèse tient, la conclusion tombe.</p></div>

const STORE = 'maths-s1-progress-v1';
let saved = { scores: {}, theme: null, last: null };
try {
  const raw = localStorage.getItem(STORE);
  if (raw) saved = Object.assign(saved, JSON.parse(raw));
} catch (e) {}
function persist() {
  try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) {}
}

const app = document.getElementById('main');
const tabbar = document.getElementById('tabbar');

/* ==========================================================================
   THEME
   ========================================================================== */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#101318' : '#f6f3ec');
}
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(saved.theme || (prefersDark ? 'dark' : 'light'));
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  saved.theme = next; persist(); applyTheme(next);
});

/* ==========================================================================
   PROGRESS
   ========================================================================== */
function updateProgress() {
  const done = CHAPTERS.filter(c => (saved.scores[c.id] || 0) >= 70).length;
  document.getElementById('progressFill').style.width = (done / CHAPTERS.length * 100) + '%';
  document.getElementById('progressTxt').textContent = done + '/' + CHAPTERS.length;
  CHAPTERS.forEach(c => {
    const t = document.getElementById('tab-' + c.id);
    if (t) t.classList.toggle('is-done', (saved.scores[c.id] || 0) >= 70);
  });
}

/* ==========================================================================
   TABS
   ========================================================================== */
const TABS = CHAPTERS.map(c => ({ id: c.id, label: c.title, num: c.num }))
  .concat([{ id: 'memo', label: 'Mémo', num: '★' }]);

TABS.forEach((t, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tab';
  b.id = 'tab-' + t.id;
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-controls', 'panel-' + t.id);
  b.setAttribute('aria-selected', 'false');
  b.innerHTML = '<span class="tab__num">' + t.num + '</span>' + t.label + '<span class="tab__dot" aria-hidden="true"></span>';
  b.addEventListener('click', () => switchTab(t.id));
  b.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const next = (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
    switchTab(TABS[next].id);
    document.getElementById('tab-' + TABS[next].id).focus();
  });
  tabbar.appendChild(b);
});

function switchTab(id) {
  TABS.forEach(t => {
    const btn = document.getElementById('tab-' + t.id);
    const pnl = document.getElementById('panel-' + t.id);
    const on = t.id === id;
    btn.setAttribute('aria-selected', on ? 'true' : 'false');
    btn.tabIndex = on ? 0 : -1;
    pnl.classList.toggle('is-active', on);
  });
  saved.last = id; persist();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

        q.opts.map((o, i) =>
          '<button class="opt" type="button" data-i="' + i + '">' +
            '<span class="opt__key" aria-hidden="true">' + LETTERS[i] + '</span><span>' + o + '</span>' +
          '</button>').join('') +
      '</div>' +
      '<div class="feedback" aria-live="polite"></div>' +
      '<div class="quiz__foot"><button class="btn" type="button" data-next hidden>Question suivante</button></div>';
    root.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(parseInt(b.dataset.i, 10))));
    root.querySelector('[data-next]').addEventListener('click', () => {
      if (idx + 1 >= total) finish(); else { idx++; draw(); }
    });
    locked = false;
  }

  function answer(i) {
    if (locked) return;
    locked = true;
    const q = ch.quiz[idx];
    root.querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = true;
      if (k === q.a) b.classList.add('is-ok');
      if (k === i && i !== q.a) b.classList.add('is-bad');
    });
    const ok = i === q.a;
    if (ok) score++;
    const fb = root.querySelector('.feedback');
    fb.className = 'feedback show';
    fb.innerHTML = '<span class="feedback__verdict ' + (ok ? 'ok' : 'bad') + '">' +
      (ok ? 'Exact' : 'Raté, la bonne réponse est ' + LETTERS[q.a]) + '</span>' + q.why;
    root.querySelectorAll('.quiz__count')[1].textContent = 'Score ' + score;
    const nextBtn = root.querySelector('[data-next]');
    nextBtn.hidden = false;
    nextBtn.textContent = (idx + 1 >= total) ? 'Voir le résultat' : 'Question suivante';
  }

  function finish() {
    const pct = Math.round(score / total * 100);
    const prev = saved.scores[ch.id] || 0;
    if (pct > prev) saved.scores[ch.id] = pct;
    persist();
    updateProgress();
    const best = Math.max(pct, prev);
    const verdict = pct >= 90 ? 'Chapitre solide. Tu peux passer au suivant.'
      : pct >= 70 ? 'Acquis. Une deuxième passe demain pour verrouiller.'
      : pct >= 40 ? 'Fragile. Relis les pièges puis refais le quiz.'
      : 'À reprendre depuis l’essentiel. Le quiz se refait autant de fois que nécessaire.';
    root.innerHTML =
      '<div class="quiz__meta"><span class="quiz__count">Terminé</span><span class="quiz__count">Meilleur score ' + best + ' %</span></div>' +
      '<div class="quiz__q">' + score + ' / ' + total + ' · ' + pct + ' %</div>' +
      '<p>' + verdict + '</p>' +
      '<div class="quiz__foot"><button class="btn" type="button" data-retry>Refaire le quiz</button></div>';
    root.querySelector('[data-retry]').addEventListener('click', () => {
      idx = 0; score = 0; draw();
    });
  }

  draw();
}

/* ==========================================================================
   MATH HELPERS
   ========================================================================== */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }

function euclid(a, b) {
  const steps = [];
  if (b === 0) return { g: a, steps: ['pgcd(' + a + ', 0) = ' + a] };
  while (b !== 0) {
    const q = Math.floor(a / b);
    const r = a % b;
    steps.push(a + ' = ' + b + ' × ' + q + ' + ' + r);
    a = b; b = r;
  }
  return { g: a, steps: steps };
}

const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function sup(n) { return String(n).split('').map(d => SUP[d] || d).join(''); }

function factorize(n) {
  n = Math.abs(Math.round(n));
  if (n < 2) return [];
  const out = [];
  for (let p = 2; p * p <= n; p++) {
    let e = 0;
    while (n % p === 0) { n /= p; e++; }
    if (e) out.push([p, e]);
  }
  if (n > 1) out.push([n, 1]);
  return out;
}
function factorStr(list) {
  if (!list.length) return '1';
  return list.map(function (f) { return f[1] === 1 ? String(f[0]) : f[0] + sup(f[1]); }).join(' × ');
}
function fracStr(num, den) {
  if (den === 0) return '∞';
  if (den < 0) { num = -num; den = -den; }
  const g = gcd(num, den) || 1;
  num /= g; den /= g;
  return den === 1 ? String(num) : num + '/' + den;
}
function num(v) { return '<span class="v">' + v + '</span>'; }

RUNNERS.arith = function () {
  const a = readInt('aA'), b = readInt('aB'), n = readInt('aN');
  const out = document.getElementById('out-arith');
  if (a === null || b === null || !Number.isInteger(a) || !Number.isInteger(b) || b === 0) {
    out.textContent = 'Il faut deux entiers, avec b ≠ 0.';
    return;
  }
  const A = Math.abs(a), B = Math.abs(b);
  const e = euclid(A, B);
  const g = e.g || 1;
  const l = (A / g) * B;
  const lines = [];
  lines.push('<span class="k">PGCD</span> = ' + num(g) + '   <span class="k">PPCM</span> = ' + num(l));
  lines.push('<span class="k">Euclide</span>');

  lines.push('<span class="k">Décomposition</span>');

  lines.push('<span class="k">Fraction</span> ' + a + '/' + b + ' = ' + num(fracStr(a, b)));
  if (n && Number.isInteger(n) && n > 1) {

    lines.push('<span class="k">Modulo ' + n + '</span> ' + a + ' ≡ ' + num(ma) + '   ·   ' + b + ' ≡ ' + num(mb));
    lines.push('  <span class="step">' + a + ' × ' + b + ' ≡ ' + ((ma * mb) % n) + ' [' + n + ']</span>');
  }
  out.innerHTML = lines.join('<br>');
};

function parseBaseToBigInt(str, base) {
  const clean = String(str).trim().toUpperCase().replace(/[\s_]/g, '');
  if (!clean) return null;
  let v = 0n;
  for (const c of clean) {
    const d = '0123456789ABCDEF'.indexOf(c);
    if (d < 0 || d >= base) return null;
    v = v * BigInt(base) + BigInt(d);
  }
  return v;
}
function toBaseBig(v, base) {
  if (v === 0n) return '0';
  const digits = '0123456789ABCDEF';
  const B = BigInt(base);
  let s = '';
  while (v > 0n) { s = digits[Number(v % B)] + s; v /= B; }
  return s;
}
function group4(bits) {
  let out = '';
  const pad = bits.padStart(Math.ceil(bits.length / 4) * 4, '0');
  for (let i = 0; i < pad.length; i += 4) out += pad.slice(i, i + 4) + ' ';
  return out.trim();
}

/* --- logique : lexer + parser --- */
function lex(srcRaw) {
  let src = String(srcRaw).replace(/\s+/g, ' ');
  src = src.replace(/\bou\b/gi, '∨').replace(/\bet\b/gi, '∧').replace(/\bnon\b/gi, '¬')
           .replace(/\bor\b/gi, '∨').replace(/\band\b/gi, '∧').replace(/\bnot\b/gi, '¬');
  src = src.replace(/\s+/g, '');
  const ops = ['<->', '<=>', '↔', '->', '=>', '→', '&&', '||', '∧', '∨', '&', '|', '^', '!', '~', '¬', '(', ')'];
  const norm = { '<->': '↔', '<=>': '↔', '↔': '↔', '->': '→', '=>': '→', '→': '→', '&&': '∧', '∧': '∧', '&': '∧', '^': '∧', '||': '∨', '∨': '∨', '|': '∨', '!': '¬', '~': '¬', '¬': '¬', '(': '(', ')': ')' };
  const tokens = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/[A-Za-z]/.test(c)) { tokens.push({ t: 'var', v: c.toLowerCase() }); i++; continue; }
    if (c === '1' || c === '0') { tokens.push({ t: 'const', v: c }); i++; continue; }
    let matched = null;
    for (const op of ops) { if (src.startsWith(op, i)) { matched = op; break; } }
    if (!matched) throw new Error('caractère inconnu : ' + c);
    tokens.push({ t: 'op', v: norm[matched] });
    i += matched.length;
  }
  return tokens;
}

function parseLogic(tokens) {
  let pos = 0;
  function peek() { return tokens[pos]; }
  function eat(v) {
    const t = tokens[pos];
    if (t && t.t === 'op' && t.v === v) { pos++; return true; }
    return false;
  }
  function parseEquiv() {
    let left = parseImpl();
    while (peek() && peek().t === 'op' && peek().v === '↔') { pos++; left = { op: '↔', a: left, b: parseImpl() }; }
    return left;
  }
  function parseImpl() {
    const left = parseOr();
    if (peek() && peek().t === 'op' && peek().v === '→') { pos++; return { op: '→', a: left, b: parseImpl() }; }
    return left;
  }
  function parseOr() {
    let left = parseAnd();
    while (peek() && peek().t === 'op' && peek().v === '∨') { pos++; left = { op: '∨', a: left, b: parseAnd() }; }
    return left;
  }
  function parseAnd() {
    let left = parseNot();
    while (peek() && peek().t === 'op' && peek().v === '∧') { pos++; left = { op: '∧', a: left, b: parseNot() }; }
    return left;
  }
  function parseNot() {
    if (peek() && peek().t === 'op' && peek().v === '¬') { pos++; return { op: '¬', a: parseNot() }; }
    return parseAtom();
  }
  function parseAtom() {
    const t = peek();
    if (!t) throw new Error('expression incomplète');
    if (t.t === 'var') { pos++; return { v: t.v }; }
    if (t.t === 'const') { pos++; return { op: t.v }; }
    if (t.t === 'op' && t.v === '(') {
      pos++;
      const e = parseEquiv();
      if (!eat(')')) throw new Error('parenthèse fermante manquante');
      return e;
    }
    throw new Error('symbole inattendu : ' + t.v);
  }
  const ast = parseEquiv();
  if (pos !== tokens.length) throw new Error('reste de l’expression non lu');
  return ast;
}

function evalLogic(ast, env) {
  if (ast.v !== undefined) return env[ast.v];
  if (ast.op === '¬') return !evalLogic(ast.a, env);
  if (ast.op === '1') return true;
  if (ast.op === '0') return false;
  const a = evalLogic(ast.a, env), b = evalLogic(ast.b, env);
  if (ast.op === '∧') return a && b;
  if (ast.op === '∨') return a || b;
  if (ast.op === '→') return !a || b;
  if (ast.op === '↔') return a === b;
  return false;
}

RUNNERS.log = function () {
  const out = document.getElementById('out-log');
  const expr = document.getElementById('logExpr').value;
  let tokens, ast;
  try {
    tokens = lex(expr);
    ast = parseLogic(tokens);
  } catch (err) {
    out.innerHTML = '<span class="step">Erreur de syntaxe : ' + err.message + '</span>';
    return;
  }
  const vars = [];
  tokens.forEach(t => { if (t.t === 'var' && vars.indexOf(t.v) < 0) vars.push(t.v); });
  vars.sort();
  if (!vars.length) { out.innerHTML = '<span class="step">Ajoute au moins une variable (p, q, r).</span>'; return; }
  if (vars.length > 5) { out.innerHTML = '<span class="step">Maximum 5 variables (32 lignes).</span>'; return; }

  const rows = [];
  const n = vars.length;
  for (let m = 0; m < Math.pow(2, n); m++) {
    const env = {};
    vars.forEach(function (v, i) { env[v] = !!(m & (1 << (n - 1 - i))); });
    rows.push({ env: env, res: evalLogic(ast, env) });
  }
  const trueCount = rows.filter(r => r.res).length;

  let html = '<table class="tt"><thead><tr>';
  vars.forEach(v => { html += '<th>' + v + '</th>'; });
  html += '<th>' + expr.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr' + (r.res ? ' class="t"' : '') + '>';
    vars.forEach(v => { html += '<td>' + (r.env[v] ? 'V' : 'F') + '</td>'; });
    html += '<td>' + (r.res ? 'V' : 'F') + '</td></tr>';
  });
  html += '</tbody></table>';
  const verdict = trueCount === rows.length ? '<span class="v">Tautologie</span> : vraie sur toutes les lignes.'
    : trueCount === 0 ? '<span class="v">Contradiction</span> : fausse sur toutes les lignes.'
    : '<span class="v">Contingence</span> : vraie sur ' + trueCount + ' ligne(s) sur ' + rows.length + '.';
  out.innerHTML = html + '<p style="margin-block:1rem 0">' + verdict + '</p>';
};

RUNNERS.ens = function () {
  const A = readInt('eA'), B = readInt('eB'), I = readInt('eI'), E = readInt('eE');
  const out = document.getElementById('out-ens');
  if (A === null || B === null || I === null) { out.textContent = 'Trois entiers attendus.'; return; }
  if (I > Math.min(A, B) || I < 0) { out.innerHTML = '<span class="step">|A ∩ B| ne peut pas dépasser min(|A|, |B|).</span>'; return; }
  const U = A + B - I;
  const lines = [];
  lines.push('<span class="k">|A ∪ B|</span> = ' + A + ' + ' + B + ' − ' + I + ' = ' + num(U));
  lines.push('<span class="k">A seul</span> = ' + num(A - I) + '   <span class="k">B seul</span> = ' + num(B - I));
  lines.push('<span class="k">Dans les deux</span> = ' + num(I));
  if (E && E >= U) {
    lines.push('<span class="k">Ni A ni B</span> = ' + E + ' − ' + U + ' = ' + num(E - U));
  } else if (E) {
    lines.push('<span class="step">|E| est plus petit que |A ∪ B| : vérifie l’énoncé.</span>');
  }
  lines.push('<span class="k">Contrôle</span> <span class="step">' + (A - I) + ' + ' + (B - I) + ' + ' + I + ' + ' + (E && E >= U ? E - U : 0) + ' = ' + (E && E >= U ? E : U) + '</span>');
  out.innerHTML = lines.join('<br>');
};

RUNNERS.powerset = function () {
  const n = readInt('eN');
  const out = document.getElementById('out-powerset');
  if (n === null || !Number.isInteger(n) || n < 0 || n > 60) { out.textContent = 'Entier entre 0 et 60 attendu.'; return; }
  const total = 1n << BigInt(n);
  out.innerHTML = '<span class="k">|P(E)|</span> = 2' + sup(n) + ' = ' + num(total.toString()) + ' sous-ensembles' +
    '<br><span class="step">En comptant l’ensemble vide et E lui-même.</span>';
};

document.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-run]');
  if (btn && RUNNERS[btn.dataset.run]) { RUNNERS[btn.dataset.run](); return; }
  const pre = e.target.closest('[data-preset]');
  if (pre) {
    document.getElementById('logExpr').value = pre.dataset.preset;
    RUNNERS.log();
  }
});
